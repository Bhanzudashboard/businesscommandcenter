<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Team — Business Command Centre</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>

:root{
  --paper:#f4f7fa;--surface:#ffffff;--raised:#fbfcfe;--line:#dce5ed;--line2:#c6d4e0;
  --ink:#0e1d2a;--mute:#57708a;--dim:#8fa4b8;
  --accent:#1668b3;--accent-soft:#e8f1fa;--accent-line:#a8cbe9;
  --pos:#0d7550;--pos-bg:#e4f3ec;--warn:#a4640f;--warn-bg:#fbeed8;--neg:#b8382a;--neg-bg:#fbe6e2;
  --off:#4f5f78;--off-bg:#e9eef4;--leave:#6f4e9c;--leave-bg:#f0eaf8;
  --strip:#0e1d2a;--strip-ink:#b9c8d6;--strip-on:#f4f7fa;
  --shadow:0 1px 2px rgba(14,29,42,.05),0 8px 24px -16px rgba(14,29,42,.18);
  --mono:'IBM Plex Mono',ui-monospace,SFMono-Regular,Menlo,monospace;
  --display:'Bricolage Grotesque','Inter',system-ui,sans-serif;
  --body:'Inter',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  color-scheme:light;
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --paper:#0b131b;--surface:#111b25;--raised:#15212d;--line:#223241;--line2:#2e4254;
  --ink:#e4edf5;--mute:#93a8bb;--dim:#62788c;
  --accent:#62a8e8;--accent-soft:#122a40;--accent-line:#285680;
  --pos:#4cc395;--pos-bg:#0e2a20;--warn:#e2a654;--warn-bg:#2d2313;--neg:#ee7e70;--neg-bg:#341b18;
  --off:#a9b8ca;--off-bg:#1a2633;--leave:#bc9fe2;--leave-bg:#261e35;
  --strip:#050a0f;--strip-ink:#8ea2b5;--strip-on:#0b131b;color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#0b131b;--surface:#111b25;--raised:#15212d;--line:#223241;--line2:#2e4254;
  --ink:#e4edf5;--mute:#93a8bb;--dim:#62788c;
  --accent:#62a8e8;--accent-soft:#122a40;--accent-line:#285680;
  --pos:#4cc395;--pos-bg:#0e2a20;--warn:#e2a654;--warn-bg:#2d2313;--neg:#ee7e70;--neg-bg:#341b18;
  --off:#a9b8ca;--off-bg:#1a2633;--leave:#bc9fe2;--leave-bg:#261e35;
  --strip:#050a0f;--strip-ink:#8ea2b5;--strip-on:#0b131b;color-scheme:dark}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-padding-top:env(safe-area-inset-top,0px);-webkit-text-size-adjust:100%}
body{background:var(--paper);color:var(--ink);font-family:var(--body);font-size:13.5px;line-height:1.5;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:4px}
img,svg{max-width:100%}
.mono{font-family:var(--mono)}

/* ── app tabs: the same strip sits on top of the command centre ── */
.apptabs{background:var(--strip);display:flex;align-items:flex-end;gap:2px;padding:8px 22px 0;overflow-x:auto}
.apptabs a{color:var(--strip-ink);text-decoration:none;font-size:12.5px;font-weight:500;padding:8px 16px 9px;border-radius:8px 8px 0 0;white-space:nowrap;display:flex;align-items:center;gap:8px}
.apptabs a:hover{color:#fff;background:rgba(255,255,255,.06)}
.apptabs a.on{background:var(--surface);color:var(--ink);font-weight:600}
.apptabs .pend{font-family:var(--mono);font-size:10.5px;background:var(--neg);color:#fff;border-radius:9px;padding:0 6px;line-height:17px}

/* ── masthead ── */
header{background:var(--surface);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:40}
.mast{display:flex;align-items:center;gap:18px;padding:14px 26px 12px;flex-wrap:wrap}
.kick{font-size:11px;color:var(--mute);margin-bottom:2px}
h1{font-family:var(--display);font-size:23px;font-weight:700;letter-spacing:-.022em;line-height:1.1}
.who{margin-left:auto;display:flex;align-items:center;gap:10px}
.av{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font-family:var(--display);font-weight:700;font-size:13px;background:var(--accent-soft);color:var(--accent);border:1px solid var(--accent-line);flex:none}
.who-t{line-height:1.25;text-align:right}
.who-t b{display:block;font-weight:600}
.who-t span{font-size:11.5px;color:var(--mute)}
.viewbar{display:flex;align-items:center;gap:12px;padding:0 26px;border-top:1px solid var(--line);flex-wrap:wrap}
.vtabs{display:flex;gap:4px;overflow-x:auto}
.vtab{background:none;border:0;padding:11px 12px 10px;font-weight:500;color:var(--mute);border-bottom:2px solid transparent;white-space:nowrap}
.vtab:hover{color:var(--ink)}
.vtab.on{color:var(--ink);border-bottom-color:var(--accent);font-weight:600}
.proto{margin-left:auto;display:flex;align-items:center;gap:8px;font-size:11.5px;color:var(--warn);padding:6px 0}
.proto select{border:1px solid var(--warn);background:var(--warn-bg);color:var(--ink);border-radius:6px;padding:4px 8px;font-size:12px}

main{max-width:1240px;margin:0 auto;padding:22px 26px 60px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow)}
.ph{display:flex;align-items:baseline;gap:10px;padding:16px 20px 0;flex-wrap:wrap}
.ph h2{font-family:var(--display);font-size:17px;font-weight:700;letter-spacing:-.01em}
.ph p{color:var(--mute);font-size:12.5px}
.ph .r{margin-left:auto}
.pb{padding:14px 20px 20px}
.note{color:var(--mute);font-size:12.5px}
.btn{border:1px solid var(--line2);background:var(--surface);border-radius:8px;padding:8px 14px;font-weight:500;font-size:13px;transition:background .15s,border-color .15s}
.btn:hover{border-color:var(--accent-line);background:var(--accent-soft)}
.btn-p{background:var(--accent);border-color:var(--accent);color:#fff}
.btn-p:hover{background:#0f5596;border-color:#0f5596}
.btn-go{background:var(--pos);border-color:var(--pos);color:#fff;font-weight:600;padding:11px 20px;font-size:14px}
.btn-go:hover{filter:brightness(1.08);background:var(--pos)}
.btn-s{padding:5px 10px;font-size:12px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.link{background:none;border:0;color:var(--accent);font-weight:500;padding:0}
.link:hover{text-decoration:underline}

/* ── status chips ── */
.st{display:inline-flex;align-items:center;gap:6px;font-size:11.5px;font-weight:600;padding:2px 9px;border-radius:20px;white-space:nowrap}
.st::before{content:'';width:6px;height:6px;border-radius:50%;background:currentColor}
.st-present{background:var(--pos-bg);color:var(--pos)}
.st-lop{background:var(--neg-bg);color:var(--neg)}
.st-weekoff{background:var(--off-bg);color:var(--off)}
.st-leave{background:var(--leave-bg);color:var(--leave)}
.st-pending{background:var(--warn-bg);color:var(--warn)}
.st-progress{background:var(--accent-soft);color:var(--accent)}
.st-future,.st-none{background:var(--paper);color:var(--dim)}

/* ── my day hero: the shift clock ── */
.hero{display:grid;grid-template-columns:auto 1fr;gap:28px;align-items:center;padding:22px 26px;margin-bottom:18px}
.clock{width:188px;height:188px;position:relative;flex:none}
.clock svg{width:100%;height:100%;transform:rotate(-90deg);overflow:visible}
.clock .trk{fill:none;stroke:var(--line);stroke-width:5}
.clock .time{fill:none;stroke:var(--warn);stroke-width:5;stroke-linecap:round;transition:stroke-dashoffset 1s linear}
.clock .seg{fill:none;stroke:var(--line);stroke-width:13;stroke-linecap:butt;transition:stroke .5s}
.clock .seg.done{stroke:var(--accent)}
.clock .seg.cur{stroke:var(--accent-line)}
.clock.allgood .seg{stroke:var(--pos)}
.clock-c{position:absolute;inset:0;display:grid;place-content:center;text-align:center}
.clock-c b{font-family:var(--display);font-size:38px;font-weight:700;letter-spacing:-.03em;line-height:1}
.clock-c span{font-size:11.5px;color:var(--mute);margin-top:4px}
.hero h2{font-family:var(--display);font-size:30px;font-weight:700;letter-spacing:-.025em;line-height:1.1}
.hero .sub{color:var(--mute);margin-top:6px;max-width:58ch}
.cd{display:flex;align-items:baseline;gap:10px;margin-top:14px;flex-wrap:wrap}
.cd b{font-family:var(--mono);font-size:26px;font-weight:600;letter-spacing:-.02em}
.cd span{color:var(--mute);font-size:12.5px}
.cd.hot b{color:var(--neg)}
.facts{display:flex;gap:26px;margin-top:16px;flex-wrap:wrap}
.fact b{font-family:var(--mono);font-size:18px;font-weight:600;display:block;line-height:1.2}
.fact span{font-size:11.5px;color:var(--mute)}
.week{display:flex;gap:6px;margin-top:16px;flex-wrap:wrap}
.wd{width:38px;text-align:center;font-size:10.5px;color:var(--mute)}
.wd i{display:block;height:8px;border-radius:4px;margin-top:4px;background:var(--line)}
.wd.present i{background:var(--pos)}.wd.lop i{background:var(--neg)}.wd.weekoff i{background:var(--off)}.wd.leave i{background:var(--leave)}.wd.progress i,.wd.pending i{background:var(--warn)}

/* ── the form flow ── */
.flow{display:grid;grid-template-columns:232px 1fr;gap:18px;align-items:start}
.rail{padding:10px;position:sticky;top:140px}
.rstep{display:flex;align-items:center;gap:11px;width:100%;background:none;border:0;padding:9px 10px;border-radius:8px;text-align:left;color:var(--mute)}
.rstep:hover{background:var(--paper)}
.rstep.on{background:var(--accent-soft);color:var(--ink);font-weight:600}
.rn{width:24px;height:24px;border-radius:50%;border:1.5px solid var(--line2);display:grid;place-items:center;font-family:var(--mono);font-size:11px;flex:none;transition:all .3s}
.rstep.ok .rn{background:var(--accent);border-color:var(--accent);color:#fff}
.rstep.bad .rn{border-color:var(--neg);color:var(--neg)}
.rl{line-height:1.25}
.rl small{display:block;font-size:11px;color:var(--dim);font-weight:400}
.stage{overflow:hidden}
.stage-in{padding:22px 24px 8px}
.stage-in.enter{animation:slideIn .38s cubic-bezier(.2,.8,.2,1)}
.stage-in.enter.back{animation-name:slideBack}
@keyframes slideIn{from{opacity:0;transform:translateX(26px)}to{opacity:1;transform:none}}
@keyframes slideBack{from{opacity:0;transform:translateX(-26px)}to{opacity:1;transform:none}}
.stage h3{font-family:var(--display);font-size:20px;font-weight:700;letter-spacing:-.015em}
.stage .why{color:var(--mute);font-size:12.5px;margin-top:3px;max-width:70ch}
.blk{margin-top:20px;padding-top:18px;border-top:1px dashed var(--line)}
.blk:first-of-type{border-top:0;padding-top:0}
.blk h4{font-size:13.5px;font-weight:600;margin-bottom:12px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.blk h4 small{font-weight:400;color:var(--mute);font-size:12px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:14px 18px}
.grid.w2{grid-template-columns:repeat(auto-fill,minmax(280px,1fr))}
.f{display:flex;flex-direction:column;gap:6px;min-width:0}
.f>label,.f>.lab{font-size:12px;font-weight:500;color:var(--mute)}
.f.err>label,.f.err>.lab{color:var(--neg)}
.f.err .inp,.f.err .stp{border-color:var(--neg)}
.inp{border:1px solid var(--line2);background:var(--raised);border-radius:8px;padding:9px 11px;width:100%;transition:border-color .15s,box-shadow .15s}
.inp:focus{outline:0;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
textarea.inp{min-height:62px;resize:vertical}
.money{position:relative}
.money .inp{padding-left:26px;font-family:var(--mono)}
.money::before{content:'₹';position:absolute;left:11px;top:50%;transform:translateY(-50%);color:var(--dim)}
.stp{display:flex;align-items:center;border:1px solid var(--line2);border-radius:8px;background:var(--raised);width:max-content}
.stp button{width:36px;height:38px;border:0;background:none;font-size:18px;color:var(--accent);border-radius:8px}
.stp button:hover{background:var(--accent-soft)}
.stp input{width:52px;text-align:center;border:0;background:none;font-family:var(--mono);font-size:15px;font-weight:600;padding:8px 0;-moz-appearance:textfield}
.stp input::-webkit-outer-spin-button,.stp input::-webkit-inner-spin-button{-webkit-appearance:none}
.stp input:focus{outline:0}
.pips{display:flex;gap:4px;margin-top:2px}
.pips i{width:16px;height:5px;border-radius:3px;background:var(--line);transition:background .3s}
.pips i.on{background:var(--pos)}
.yn{display:inline-flex;border:1px solid var(--line2);border-radius:8px;overflow:hidden;width:max-content}
.yn button{border:0;background:var(--raised);padding:8px 16px;font-weight:500;color:var(--mute)}
.yn button+button{border-left:1px solid var(--line2)}
.yn button.on[data-v="yes"]{background:var(--pos);color:#fff}
.yn button.on[data-v="no"]{background:var(--neg);color:#fff}
.yn button.on:not([data-v="yes"]):not([data-v="no"]){background:var(--accent);color:#fff}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1px solid var(--line2);background:var(--raised);border-radius:20px;padding:6px 13px;font-size:12.5px;display:inline-flex;align-items:center;gap:7px;transition:all .18s}
.chip::before{content:'';width:14px;height:14px;border-radius:50%;border:1.5px solid var(--line2);transition:all .18s}
.chip.on{border-color:var(--pos);background:var(--pos-bg);color:var(--ink)}
.chip.on::before{background:var(--pos);border-color:var(--pos);box-shadow:inset 0 0 0 3px var(--pos-bg)}
.chip:active{transform:scale(.96)}
.live{display:flex;gap:14px;margin-top:16px;flex-wrap:wrap}
.meter{flex:1;min-width:220px;background:var(--paper);border-radius:10px;padding:12px 14px}
.meter .top{display:flex;justify-content:space-between;align-items:baseline;font-size:12px;color:var(--mute)}
.meter .top b{font-family:var(--mono);font-size:18px;color:var(--ink)}
.bar{height:8px;background:var(--line);border-radius:5px;margin-top:8px;position:relative;overflow:visible}
.bar i{display:block;height:100%;border-radius:5px;background:var(--accent);width:0;transition:width .6s cubic-bezier(.2,.8,.2,1),background .3s}
.bar i.good{background:var(--pos)}.bar i.bad{background:var(--neg)}.bar i.mid{background:var(--warn)}
.bar .mark{position:absolute;top:-4px;bottom:-4px;width:2px;background:var(--ink);opacity:.5}
.meter .msg{font-size:11.5px;margin-top:6px;color:var(--mute)}
.case{border:1px solid var(--line);border-radius:10px;padding:14px;margin-top:10px;background:var(--raised)}
.case.new{animation:pop .3s ease}
@keyframes pop{from{opacity:0;transform:scale(.97)}to{opacity:1;transform:none}}
.case-h{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;font-weight:600;font-size:12.5px}
.warnline{font-size:12px;color:var(--warn);background:var(--warn-bg);padding:6px 10px;border-radius:6px;margin-top:8px}
.foot{display:flex;align-items:center;gap:10px;padding:16px 24px;border-top:1px solid var(--line);margin-top:22px;background:var(--raised);flex-wrap:wrap}
.foot .sp{flex:1}
.foot .saved{font-size:12px;color:var(--dim)}
.errs{font-size:12.5px;color:var(--neg)}

/* ── done / closed states ── */
.done{padding:34px 28px;display:grid;grid-template-columns:auto 1fr;gap:30px;align-items:center}
.stamp{width:150px;height:150px;border-radius:50%;border:4px double var(--pos);color:var(--pos);display:grid;place-content:center;text-align:center;transform:rotate(-9deg);flex:none}
.stamp b{font-family:var(--display);font-size:28px;font-weight:700;letter-spacing:.01em;line-height:1}
.stamp span{font-family:var(--mono);font-size:11px;margin-top:5px}
.stamp.anim{animation:stamp .55s cubic-bezier(.2,1.6,.4,1)}
@keyframes stamp{0%{opacity:0;transform:rotate(-9deg) scale(2.2)}60%{opacity:1}100%{transform:rotate(-9deg) scale(1)}}
.stamp.lop{border-color:var(--neg);color:var(--neg)}
.stamp.weekoff{border-color:var(--off);color:var(--off)}
.stamp.leave{border-color:var(--leave);color:var(--leave)}
.done h3{font-family:var(--display);font-size:24px;font-weight:700;letter-spacing:-.02em}
.done p{color:var(--mute);margin-top:6px;max-width:62ch}
.done .acts{display:flex;gap:10px;margin-top:16px;flex-wrap:wrap}
.sumgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;margin-top:18px}
.sum{background:var(--paper);border-radius:8px;padding:10px 12px}
.sum b{font-family:var(--mono);font-size:16px;display:block}
.sum span{font-size:11.5px;color:var(--mute)}

/* ── kpis & tables ── */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin-bottom:18px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 16px;box-shadow:var(--shadow)}
.kpi>span{font-size:12px;color:var(--mute)}
.kpi b{display:block;font-family:var(--mono);font-size:24px;font-weight:600;letter-spacing:-.02em;margin-top:2px}
.kpi>small{font-size:11.5px;color:var(--dim)}
.kpi.neg b{color:var(--neg)}.kpi.pos b{color:var(--pos)}
.tw{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:12.5px}
th{text-align:left;font-weight:500;color:var(--mute);font-size:11.5px;padding:9px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:10px;border-bottom:1px solid var(--line);white-space:nowrap}
td.n,th.n{text-align:right;font-family:var(--mono)}
tr.click{cursor:pointer}
tr.click:hover td{background:var(--paper)}
.good{color:var(--pos)}.bad{color:var(--neg)}.mid{color:var(--warn)}
.tl-n{display:flex;align-items:center;gap:9px;font-weight:500}
.tl-n .av{width:26px;height:26px;font-size:10.5px}

/* ── calendar ── */
.calwrap{display:grid;grid-template-columns:1fr 300px;gap:18px;align-items:start}
.calhead{display:flex;align-items:center;gap:10px;padding:16px 20px 6px}
.calhead h2{font-family:var(--display);font-size:20px;font-weight:700;letter-spacing:-.015em;min-width:160px}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;padding:10px 20px 20px}
.cal .dh{font-size:11px;color:var(--mute);text-align:center;padding-bottom:4px}
.cd2{aspect-ratio:1/0.72;border-radius:9px;border:1px solid var(--line);background:var(--raised);padding:6px 7px;text-align:left;display:flex;flex-direction:column;justify-content:space-between;position:relative;min-height:54px;transition:transform .15s,box-shadow .15s}
.cd2 .dn{font-family:var(--mono);font-size:12px;font-weight:600}
.cd2 .dl{font-size:10px;font-weight:600;line-height:1.15}
.cd2.present{background:var(--pos-bg);border-color:transparent;color:var(--pos)}
.cd2.lop{background:var(--neg-bg);border-color:transparent;color:var(--neg)}
.cd2.weekoff{background:var(--off-bg);border-color:transparent;color:var(--off)}
.cd2.leave{background:var(--leave-bg);border-color:transparent;color:var(--leave)}
.cd2.pending,.cd2.progress{background:var(--warn-bg);border-color:var(--warn);color:var(--warn)}
.cd2.future{color:var(--mute)}
.cd2.none,.cd2.blank{background:transparent;border-color:transparent;color:var(--dim)}
.cd2.can{cursor:pointer}
.cd2.can:hover{transform:translateY(-2px);box-shadow:var(--shadow)}
.cd2.lock{opacity:.55}
.cd2.sel{outline:2px solid var(--accent);outline-offset:1px;transform:translateY(-2px)}
.cd2 .rv{position:absolute;top:5px;right:6px;font-size:9px;font-weight:700;color:var(--neg)}
.legend{display:flex;gap:12px;flex-wrap:wrap;padding:0 20px 16px;font-size:11.5px;color:var(--mute)}
.legend span{display:inline-flex;align-items:center;gap:5px}
.legend i{width:10px;height:10px;border-radius:3px;display:inline-block}
.side .pb>*+*{margin-top:12px}
.side .sumgrid{grid-template-columns:1fr 1fr}
.rule{font-size:12px;color:var(--mute);padding-left:14px;position:relative}
.rule::before{content:'';position:absolute;left:2px;top:7px;width:5px;height:5px;border-radius:50%;background:var(--accent-line)}

/* ── floor ── */
.board{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:12px}
.grp{margin-bottom:18px}
.grp-h{font-size:12px;color:var(--mute);margin:0 0 8px 2px}
.grp-h b{color:var(--ink);font-weight:600}
.tile{perspective:800px;height:104px}
.tile-in{position:relative;width:100%;height:100%;transition:transform .7s cubic-bezier(.3,1.3,.5,1);transform-style:preserve-3d}
.tile.flip .tile-in{transform:rotateX(180deg)}
.face{position:absolute;inset:0;border-radius:11px;border:1px solid var(--line);background:var(--surface);padding:12px 14px;backface-visibility:hidden;-webkit-backface-visibility:hidden;display:flex;flex-direction:column;justify-content:space-between;box-shadow:var(--shadow)}
.face.back{transform:rotateX(180deg);background:var(--pos-bg);border-color:transparent}
.face .tl-n{font-weight:600}
.face .meta{display:flex;justify-content:space-between;align-items:center;gap:6px;white-space:nowrap;font-size:11.5px;color:var(--mute)}
.face.back .meta{color:var(--pos)}
.face.lopf{background:var(--neg-bg);border-color:transparent}
.face.offf{background:var(--off-bg);border-color:transparent}
.face.lvf{background:var(--leave-bg);border-color:transparent}
.just{animation:glow 1.6s ease 2}
@keyframes glow{50%{box-shadow:0 0 0 4px var(--pos-bg),0 0 0 6px var(--pos)}}
.heat{display:grid;gap:3px;font-size:10.5px;align-items:center}
.heat .hn{white-space:nowrap;padding-right:10px;color:var(--ink);font-size:12px}
.heat .hd{color:var(--dim);text-align:center;font-family:var(--mono);font-size:9.5px}
.hc{height:20px;border-radius:4px;background:var(--line)}
.hc.present{background:var(--pos)}.hc.lop{background:var(--neg)}.hc.weekoff{background:var(--off);opacity:.5}.hc.leave{background:var(--leave);opacity:.75}
.hc.pending,.hc.progress{background:var(--warn)}.hc.future,.hc.none{background:var(--paper)}
.hc.rv{background:repeating-linear-gradient(45deg,var(--leave) 0 3px,var(--neg) 3px 6px)}
.lb{display:flex;flex-direction:column;gap:8px}
.lbr{display:grid;grid-template-columns:22px 1fr auto;gap:10px;align-items:center}
.lbr .rk{font-family:var(--mono);color:var(--dim);font-size:12px}
.lbr .bar{margin-top:4px;height:6px}
.lbr .v{font-family:var(--mono);font-size:12.5px;font-weight:600}
.flame{font-family:var(--mono);font-size:11.5px;color:var(--warn);font-weight:600}
.two{display:grid;grid-template-columns:1.4fr 1fr;gap:18px;margin-top:18px;align-items:start}

/* ── overlays ── */
.scrim{position:fixed;inset:0;background:rgba(8,16,24,.45);z-index:80;display:flex;justify-content:center;align-items:flex-start;padding:5vh 16px;overflow:auto;animation:fade .2s}
@keyframes fade{from{opacity:0}}
.modal{background:var(--surface);border-radius:14px;width:min(860px,100%);box-shadow:0 30px 80px -30px rgba(0,0,0,.5);animation:rise .3s cubic-bezier(.2,.8,.2,1)}
@keyframes rise{from{opacity:0;transform:translateY(16px)}}
.mh{display:flex;align-items:center;gap:12px;padding:18px 22px;border-bottom:1px solid var(--line)}
.mh h2{font-family:var(--display);font-size:18px;font-weight:700}
.mh .x{margin-left:auto;border:0;background:none;font-size:22px;color:var(--mute);width:34px;height:34px;border-radius:8px}
.mh .x:hover{background:var(--paper)}
.mb{padding:18px 22px 22px}
.mails{display:grid;grid-template-columns:260px 1fr;gap:16px;min-height:300px}
.mlist{display:flex;flex-direction:column;gap:6px;max-height:440px;overflow:auto}
.mi{text-align:left;border:1px solid var(--line);background:var(--raised);border-radius:8px;padding:9px 11px;font-size:12px}
.mi.on{border-color:var(--accent);background:var(--accent-soft)}
.mi b{display:block;font-size:12.5px}
.mi span{color:var(--mute)}
.mail{border:1px solid var(--line);border-radius:10px;overflow:hidden}
.mail .hdr{background:var(--paper);padding:12px 16px;font-size:12px;line-height:1.75}
.mail .hdr span{color:var(--mute);display:inline-block;width:56px}
.mail .hdr .subj{font-weight:600;font-size:14px;margin-top:4px}
.mail .bd{padding:16px;white-space:pre-wrap;font-size:13px;line-height:1.6}
.tag{font-size:10.5px;font-weight:600;padding:1px 7px;border-radius:10px;margin-left:6px}
.tag.lop{background:var(--neg-bg);color:var(--neg)}.tag.rev{background:var(--leave-bg);color:var(--leave)}.tag.rem{background:var(--warn-bg);color:var(--warn)}
.kv{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:4px 20px;font-size:12.5px}
.kv div{display:flex;justify-content:space-between;gap:10px;padding:6px 0;border-bottom:1px dashed var(--line)}
.kv span{color:var(--mute)}
.kv b{font-weight:500;text-align:right;white-space:normal}
.dsec{margin-top:16px}
.dsec h4{font-size:13px;margin-bottom:6px}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--paper);padding:10px 18px;border-radius:10px;font-size:13px;z-index:99;animation:rise .25s;box-shadow:0 10px 30px -10px rgba(0,0,0,.5);max-width:90vw}
#confetti{position:fixed;inset:0;pointer-events:none;z-index:95}


.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.verd{display:flex;flex-wrap:wrap;gap:8px}
.verd button{border:1px solid var(--line2);background:var(--raised);border-radius:8px;padding:7px 12px;font-size:12.5px;font-weight:500;color:var(--mute);transition:all .18s}
.verd button:hover{border-color:var(--vc);color:var(--ink)}
.verd button.on{background:var(--vc);border-color:var(--vc);color:#fff}
.verd button:active{transform:scale(.96)}
.vchip{font-size:11px;font-weight:600;padding:2px 8px;border-radius:10px;color:var(--vc);background:color-mix(in srgb,var(--vc) 14%,transparent);white-space:nowrap}
.case-h small{font-weight:400}
.pipe{background:var(--paper);border-radius:10px;padding:14px 16px;margin-bottom:14px}
.pipe-h{font-size:15px}
.pipe-h b,.pipe-big b{font-family:var(--mono);font-size:21px;font-weight:600}
.pbar{height:10px;background:var(--accent-line);border-radius:6px;margin-top:10px;overflow:hidden}
.pbar i{display:block;height:100%;background:var(--pos);width:0;transition:width .6s cubic-bezier(.2,.8,.2,1)}
.prows{display:flex;flex-direction:column}
.prow{display:grid;grid-template-columns:1fr 128px 128px;gap:16px;align-items:center;padding:8px 0;border-bottom:1px dashed var(--line)}
.prow.ph2{padding:0 0 4px}
.prow.ph2 span{font-size:11.5px;color:var(--mute);text-align:center}
.prow .f{gap:0;align-items:center}
.prow .pips{display:none}
.prow .pl{font-weight:500}
.sums{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:12px;margin-top:16px}
.scard{border:1px solid var(--line);border-radius:10px;padding:14px;background:var(--raised)}
.scard.bad{border-color:var(--neg);background:var(--neg-bg)}
.sc-h{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:6px;gap:10px}
.slist{list-style:none;display:flex;flex-direction:column;gap:6px;margin-top:8px;font-size:12.5px}
.slist li{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.pipe-big{font-size:15px}
.pcats{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:10px;margin:14px 0 18px}
.pcat{background:var(--paper);border-radius:8px;padding:10px 12px}
.pcat span{display:block;font-size:11.5px;color:var(--mute)}
.pcat b{font-family:var(--mono);font-size:18px}
.pcat small{color:var(--dim);font-size:11px;margin-left:6px}
.pteam{display:flex;flex-direction:column;gap:10px}
.ptr{display:grid;grid-template-columns:190px 1fr 250px;gap:14px;align-items:center}
.ptrack{display:flex;height:14px;background:var(--paper);border-radius:7px;overflow:hidden}
.ptrack i{display:block;height:100%;width:0;transition:width .9s cubic-bezier(.2,.8,.2,1)}
.ptrack i.in{width:var(--w)}
.ptrack .pc{background:var(--pos)}
.ptrack .po{background:var(--accent-line)}
.pnum{font-size:12px;color:var(--mute)}
.pnum b{color:var(--ink)}
@media (max-width:700px){.ptr{grid-template-columns:1fr;gap:6px}.prow{grid-template-columns:1fr 110px 110px;gap:8px}.prow .stp button{width:30px}.prow .stp input{width:40px}}
.egrid{display:grid;grid-template-columns:minmax(90px,1fr) repeat(3,minmax(80px,140px));gap:8px 12px;align-items:center}
.egrid .eh{font-size:11.5px;color:var(--mute);text-align:center}
.egrid .et{font-family:var(--mono);font-size:15px;text-align:center;padding:6px 0;border-top:1px solid var(--line)}
.egrid .inp{text-align:center}
.trend{display:grid;grid-template-columns:repeat(14,1fr);gap:6px;height:210px;align-items:end}
.tcol{display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;gap:4px;min-width:0}
.tcol i{display:block;width:70%;max-width:38px;height:0;background:var(--accent);border-radius:5px 5px 2px 2px;transition:height .8s cubic-bezier(.2,.8,.2,1)}
.tcol i.in{height:calc(var(--h) * .72)}
.tv{font-family:var(--mono);font-size:10px;color:var(--mute)}
.th{font-family:var(--mono);font-size:10px;color:var(--pos);font-weight:600}
.td{font-size:10px;color:var(--dim);white-space:nowrap}
.signin{display:grid;grid-template-columns:auto 1fr;gap:30px;align-items:center;padding:34px 30px;max-width:720px;margin:40px auto}
.signin h2{font-family:var(--display);font-size:24px;font-weight:700;letter-spacing:-.02em}
@media (max-width:900px){
  .flow,.calwrap,.two{grid-template-columns:1fr}
  .rail{position:static;display:flex;overflow-x:auto;gap:4px}
  .rstep{width:auto;flex:none}
  .rl small{display:none}
  .hero{grid-template-columns:1fr;justify-items:start;padding:18px}
  .clock{width:150px;height:150px}
  .clock-c b{font-size:30px}
  .done{grid-template-columns:1fr;justify-items:start}
  .mails{grid-template-columns:1fr}
}
@media (max-width:640px){
  .mast,.viewbar{padding-left:15px;padding-right:15px}
  main{padding:14px 12px 50px}
  .apptabs{padding:6px 10px 0}
  .who-t{display:none}
  .proto{margin-left:0;width:100%}
  .hero h2{font-size:24px}
  .stage-in{padding:18px 16px 4px}
  .foot{padding:14px 16px}
  .cal{gap:4px;padding:8px 10px 16px}
  .cd2{padding:4px;min-height:44px}
  .cd2 .dl{font-size:8.5px}
}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}

:root{--wfh:#8a5a00;--wfh-bg:#fdf1d8}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--wfh:#e8b45a;--wfh-bg:#2e2412}}
.proto{gap:6px}
.proto .simt{font-family:var(--mono);font-weight:600;color:var(--ink);background:var(--warn-bg);border-radius:6px;padding:3px 8px}
.proto .btn-s{padding:3px 8px;font-size:11.5px;border-color:var(--warn)}
.proto .btn-s.on{background:var(--warn);color:#fff}
/* my shift */
.shift{display:grid;grid-template-columns:auto 1fr;gap:30px;align-items:center;padding:24px 28px}
.ring{width:200px;height:200px;position:relative;flex:none}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring .trk{fill:none;stroke:var(--line);stroke-width:12}
.ring .hrs{fill:none;stroke:var(--accent);stroke-width:12;stroke-linecap:round;transition:stroke-dashoffset .8s cubic-bezier(.2,.8,.2,1),stroke .4s}
.ring .hrs.full{stroke:var(--pos)}
.ring .brk{fill:none;stroke:var(--line);stroke-width:6}
.ring .brkv{fill:none;stroke:var(--warn);stroke-width:6;stroke-linecap:round;transition:stroke-dashoffset .8s}
.ring .brkv.over{stroke:var(--neg)}
.ring-c{position:absolute;inset:0;display:grid;place-content:center;text-align:center}
.ring-c b{font-family:var(--mono);font-size:34px;font-weight:600;letter-spacing:-.03em;line-height:1}
.ring-c span{font-size:11.5px;color:var(--mute);margin-top:6px}
.shift h2{font-family:var(--display);font-size:28px;font-weight:700;letter-spacing:-.025em;line-height:1.15}
.shift .sub{color:var(--mute);margin-top:6px;max-width:64ch}
.acts{display:flex;gap:10px;flex-wrap:wrap;margin-top:18px}
.big{border:0;border-radius:10px;padding:13px 20px;font-weight:600;font-size:14.5px;color:#fff;background:var(--accent);transition:transform .12s,filter .15s}
.big:hover{filter:brightness(1.08)}.big:active{transform:scale(.97)}
.big.go{background:var(--pos)}.big.wfh{background:var(--wfh)}.big.brk{background:var(--warn)}.big.stop{background:var(--neg)}
.big.ghost{background:var(--surface);color:var(--ink);border:1px solid var(--line2)}
.big:disabled{opacity:.4;cursor:not-allowed;filter:none;transform:none}
.why{font-size:12px;color:var(--mute);margin-top:8px}
.why.bad{color:var(--neg)}
.tline{position:relative;height:30px;background:var(--paper);border-radius:7px;margin-top:20px;overflow:hidden;border:1px solid var(--line)}
.tline i{position:absolute;top:0;bottom:0}
.tline .s-off{background:var(--accent-line)}
.tline .s-wfh{background:repeating-linear-gradient(135deg,var(--wfh-bg) 0 6px,color-mix(in srgb,var(--wfh) 35%,transparent) 6px 8px)}
.tline .s-brk{background:var(--warn);opacity:.85}
.tline .s-brk.over{background:var(--neg)}
.tline .nine{width:2px;background:var(--pos);z-index:2}
.tline .nowm{width:2px;background:var(--ink);z-index:3}
.tticks{position:relative;height:16px;font-family:var(--mono);font-size:10px;color:var(--dim);margin-top:3px}
.tticks span{position:absolute;transform:translateX(-50%);white-space:nowrap}
.tleg{display:flex;gap:14px;flex-wrap:wrap;font-size:11.5px;color:var(--mute);margin-top:8px}
.tleg i{display:inline-block;width:12px;height:8px;border-radius:2px;margin-right:5px;vertical-align:middle}
.stats{display:flex;gap:26px;flex-wrap:wrap;margin-top:16px}
.stat b{font-family:var(--mono);font-size:17px;font-weight:600;display:block}
.stat span{font-size:11.5px;color:var(--mute)}
.hb{font-size:11.5px;color:var(--mute);display:inline-flex;align-items:center;gap:6px;margin-top:14px}
.hb::before{content:'';width:7px;height:7px;border-radius:50%;background:var(--pos);animation:pulse 2s infinite}
@keyframes pulse{50%{opacity:.3}}
/* numbers */
.att{display:flex;align-items:center;gap:16px}
.att .rg{width:86px;height:86px;flex:none;position:relative}
.att svg{width:100%;height:100%;transform:rotate(-90deg)}
.att .t{fill:none;stroke:var(--line);stroke-width:9}
.att .v{fill:none;stroke-width:9;stroke-linecap:round;transition:stroke-dashoffset 1s cubic-bezier(.2,.8,.2,1)}
.att .rg b{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--mono);font-size:15px}
.segs{display:inline-flex;border:1px solid var(--line2);border-radius:8px;overflow:hidden;flex-wrap:wrap}
.segs button{border:0;background:var(--raised);padding:7px 13px;font-size:12.5px;color:var(--mute);font-weight:500}
.segs button+button{border-left:1px solid var(--line2)}
.segs button.on{background:var(--accent);color:#fff}
.dbar{display:flex;align-items:center;gap:8px;min-width:150px}
.dbar .bar{flex:1;margin:0;height:7px}
.chart{width:100%;height:190px;display:block}
.chart .b{fill:var(--accent-line)}.chart .l{fill:none;stroke:var(--pos);stroke-width:2.2}
.chart .ax{font-family:var(--mono);font-size:9.5px;fill:var(--dim)}
.me td{background:var(--accent-soft)!important;font-weight:600}
/* team now */
.ictiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:10px}
.ict{border:1px solid var(--line);border-left:4px solid var(--line2);border-radius:10px;padding:11px 13px;background:var(--surface);text-align:left;display:flex;flex-direction:column;gap:7px;transition:transform .15s,box-shadow .15s;animation:pop .35s ease both}
.ict:hover{transform:translateY(-2px);box-shadow:var(--shadow)}
.ict .top{display:flex;align-items:center;gap:8px;justify-content:space-between}
.ict .nm{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ict .mini{display:flex;flex-wrap:wrap;gap:2px 10px;justify-content:space-between;font-size:11.5px;color:var(--mute);font-family:var(--mono)}
.ict .bar{margin:0;height:6px}
.ict.k-working{border-left-color:var(--pos)}.ict.k-break{border-left-color:var(--warn)}.ict.k-overrun{border-left-color:var(--neg);background:var(--neg-bg)}
.ict.k-notin,.ict.k-lop{border-left-color:var(--neg)}.ict.k-short{border-left-color:var(--neg)}.ict.k-done{border-left-color:var(--accent)}
.ict.k-leave{border-left-color:var(--leave)}.ict.k-weekoff,.ict.k-holiday{border-left-color:var(--off)}.ict.k-excused{border-left-color:var(--leave)}
.st-working{background:var(--pos-bg);color:var(--pos)}.st-break{background:var(--warn-bg);color:var(--warn)}.st-overrun,.st-short,.st-notin{background:var(--neg-bg);color:var(--neg)}
.st-done,.st-complete{background:var(--accent-soft);color:var(--accent)}.st-excused{background:var(--leave-bg);color:var(--leave)}.st-holiday{background:var(--off-bg);color:var(--off)}
.st-wfh{background:var(--wfh-bg);color:var(--wfh)}
.flag{font-size:11px;color:var(--neg);font-weight:600}
.flag.amber{color:var(--warn)}
/* attendance grid */
.hc.complete{background:var(--pos)}.hc.short{background:var(--neg);opacity:.75}.hc.lop{background:var(--neg)}.hc.excused{background:var(--leave);opacity:.55}
.hc.holiday{background:var(--off);opacity:.35}.hc.tonight{background:var(--accent);opacity:.55}
.hc.click{cursor:pointer}.hc.click:hover{outline:2px solid var(--ink);outline-offset:1px}
.hc.esc{box-shadow:inset 0 0 0 2px var(--ink)}
/* follow-ups */
.vchip{font-size:11px;font-weight:600;padding:2px 8px;border-radius:10px;color:var(--vc);background:color-mix(in srgb,var(--vc) 14%,transparent);white-space:nowrap}
.fugrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:10px}
.fuc{display:flex;flex-direction:column;align-items:flex-start;gap:4px;text-align:left;border:1px solid var(--line);border-radius:11px;padding:12px 14px;background:var(--surface);transition:transform .15s,box-shadow .15s;animation:pop .3s ease both}
.fuc:hover{transform:translateY(-2px);box-shadow:var(--shadow)}
.fuc b{font-family:var(--mono);font-size:26px;line-height:1.1}
.fuc .fn{font-weight:600}
.fuc.h-hot{border-left:4px solid var(--neg)}.fuc.h-warm{border-left:4px solid var(--warn)}.fuc.h-cold{border-left:4px solid var(--off)}
.lid{font-size:12px}
/* pace nudge */
.nudge{display:flex;gap:14px;align-items:center;flex-wrap:wrap;background:var(--warn-bg);border:1px solid var(--warn);border-radius:12px;padding:14px 18px;margin-bottom:16px;animation:rise .4s ease}
.nudge b{color:var(--warn)}
.nudge span{flex:1;min-width:260px}
/* 100% club */
.club{margin-bottom:18px;background:linear-gradient(120deg,var(--pos-bg),var(--surface) 60%)}
.clubc{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--surface);border-radius:22px;padding:4px 12px 4px 4px;font-weight:600;font-size:12.5px}
.clubc .av{width:26px;height:26px;font-size:10.5px;background:var(--pos-bg);color:var(--pos);border-color:var(--pos)}
/* filters */
.fbar{display:flex;align-items:center;gap:10px 12px;flex-wrap:wrap}
.fbar .fl{font-size:12px;color:var(--mute);margin-left:6px}
.fbar .fl:first-child{margin-left:0}
.kpi .usplit{display:flex;gap:14px;margin-top:6px;}
.kpi .usplit b{display:inline;margin-top:0;font-size:15px;font-family:var(--mono,inherit);margin-right:3px}
.exportbar{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin:14px 0 4px}
.tlpick-wrap{display:inline-flex;align-items:center;gap:8px;position:relative}
.tlpick{position:relative}
.tlpick>summary{list-style:none;cursor:pointer;width:auto;min-width:170px;padding-right:30px;position:relative;user-select:none}
.tlpick>summary::-webkit-details-marker{display:none}
.tlpick>summary::after{content:"";position:absolute;right:12px;top:50%;width:6px;height:6px;border-right:1.5px solid currentColor;border-bottom:1.5px solid currentColor;transform:translateY(-70%) rotate(45deg);opacity:.6}
.tlpick[open]>summary::after{transform:translateY(-20%) rotate(-135deg)}
.tlpick>summary:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

<script>
/* ════════════════════════════════════════════════════════════════════
   TEAM — prototype. Sample attendance and targets; numbers are your
   command centre's August extract, shown as this month.
   ════════════════════════════════════════════════════════════════════ */
/* ── go live: paste the same two values as in kra.html. Blank = prototype on sample data. ── */
const LIVE = {
  ENDPOINT: '',   // your Apps Script web app URL, ending in /exec (same as kra.html)

};
/* If the two values above are left blank, borrow them from kra.html on the same site,
   so the Team page keeps working even when a fresh copy is uploaded without them. */
if (!LIVE.ENDPOINT && /^https?:$/.test(location.protocol)) {
  try {
    const x = new XMLHttpRequest(); x.open('GET', 'kra.html?k=' + Date.now(), false); x.send();

}
const KEYS_MISSING = /^https?:$/.test(location.protocol) && !(LIVE.ENDPOINT && LIVE.CLIENT_ID);
const IS_LIVE = !!LIVE.ENDPOINT && !KEYS_MISSING;
let LIVE_OFF = 0;
const liveNote = () => IS_LIVE ? `<p class="note" style="margin-bottom:12px">From the US MASTER DB${typeof NUM_BUILT !== 'undefined' && NUM_BUILT ? ', updated ' + fmtT(NUM_BUILT) : ''} · refreshed every 15 minutes · a bundle counts as 1 sale</p>` : '<p class="note" style="margin-bottom:12px">Prototype: real numbers from your US Master DB, shown as this month.</p>';
const DATA = {"people":[],"tls":[],"mgrs":[],"months":["2026-01"],"cur":0,"thru":1,"own":[],"tlb":[],"DM":[],"EM":[],"vocab":{"eth":[],"source":[],"utm":[],"country":[],"grade":[],"subj":[],"team":[]},"dims":[["eth","Ethnicity"],["source","Source"],["utm","UTM"],["country","Country"],["grade","Grade"],["subj","Subject"],["team","RP / OTP"]],"prod":["Math","English","Bundle"],"stages":[]};
const RULES = { LATE_MIN: 15, LATE_MAIL_AT: 2, DEV_AT: 0.8, DEV_CHECK_MIN: 90, REM_FIRST: '00:20', REM_EVERY_H: 3, REM_MGR: '07:00', SHIFT_MIN: 9 * 60, BREAK_MIN: 60, AUTO_OUT_MIN: 10 * 60, LOP_AT: '11:30', DC2E_TARGET: 0.35, WARN_BELOW: 0.45, IDLE_FLAG_MIN: 30 };
const MGRS = Object.fromEntries(DATA.mgrs.map(m => [m.id, { name: m.name, email: m.email, emp: m.emp }]));
const ADMINS = [{ id: 'bc', name: 'Budhaditya Chakraborty', email: 'budhaditya.chakraborty@expinfi.com', sup: true }, { id: 'bv', name: 'Bharath Venkatesh', email: 'bharath.venkatesh@expinfi.com', sup: false }];
const ADMIN = ADMINS[0];
const adminEmails = () => ADMINS.map(x => x.email);          // anything sent to an admin goes to every admin, the Super admin included
const TLS = DATA.tls.map(t => ({ ...t, team: ['umar', 'prathuin'].includes(t.id) ? 'OTP' : 'RP', active: true }));
const TL = id => TLS.find(t => t.id === id);
const slug = n => n.toLowerCase().replace(/[^a-z]+/g, '.').replace(/^\.|\.$/g, '');
const ICS = DATA.people.map(p => {
  const D = [], E = [];
  if (p.own >= 0) {
    DATA.DM.forEach(r => { if (r[2] === p.own && r[0] === DATA.cur && r[1] <= DATA.thru) D.push([r[1], r[4], ...r.slice(5, 12)]); });
    DATA.EM.forEach(r => { if (r[2] === p.own && r[0] === DATA.cur && r[1] <= DATA.thru) E.push([r[1], r[8], r[4], r[5], r[6], r[7], ...r.slice(9, 16)]); });
  }
  return { id: slug(p.email.split('@')[0]), name: p.name, email: p.email, emp: p.emp, crm: p.crm, own: p.own, tl: p.tl, home: p.team, active: p.active, d: { D, E, F: p.F } };
}).sort((a, b) => a.name.localeCompare(b.name));
const IC = id => ICS.find(x => x.id === id);
const TLP = TLS.map(t => ({ id: 'tl-' + t.id, name: t.name, email: t.email, tl: t.id, isTL: true, home: 'TL', d: { D: [], E: [], F: [] } }));
const NRP = [];   // per team lead: demos and sales under that team whose owner is not on the Team Roster
const FRP = [];   // demos and sales under a former team lead or a BM-led team (no current team lead)
const PERSON = id => IC(id) || TLP.find(p => p.id === id);
const ACTIVE = () => ICS.filter(x => x.active);
const PEOPLE = () => ICS.filter(x => x.active).concat(TLP);
const icsOf = tl => ICS.filter(x => x.tl === tl && x.active);

/* ── helpers ── */
const $ = id => document.getElementById(id);
const esc = v => String(v == null ? '' : v).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#39;');
const initials = n => n.split(/\s+/).map(w => w[0]).slice(0, 2).join('').toUpperCase();
const first = n => n.split(' ')[0];
const fmtN = v => v == null || isNaN(v) ? '—' : Math.round(v).toLocaleString('en-IN');
const fmt1 = v => v == null || isNaN(v) ? '—' : (Math.round(v * 10) / 10).toLocaleString('en-IN');
const money = v => v == null || isNaN(v) ? '—' : '₹' + Math.round(v).toLocaleString('en-IN');
const lakh = v => v == null || isNaN(v) ? '—' : '₹' + (v / 1e5).toFixed(v >= 1e7 ? 0 : 1) + ' L';
const pct = (v, d = 0) => v == null || !isFinite(v) ? '—' : (v * 100).toFixed(d) + '%';
const REDUCED = matchMedia('(prefers-reduced-motion: reduce)').matches;

/* ── IST time. A Date shifted +5:30 read with getUTC* is IST wall time. ── */
const IST = 330 * 60000, DAY = 864e5, MIN = 60000, HR = 3600000;
const key = d => d.toISOString().slice(0, 10);
const fromKey = k => new Date(k + 'T00:00:00Z');
const addDays = (k, n) => key(new Date(fromKey(k).getTime() + n * DAY));
const dow = k => fromKey(k).getUTCDay();
const istMs = (k, hh, mm = 0) => Date.UTC(+k.slice(0, 4), +k.slice(5, 7) - 1, +k.slice(8, 10), hh, mm) - IST;
const fmtDay = k => fromKey(k).toLocaleDateString('en-GB', { weekday: 'short', day: 'numeric', month: 'short', timeZone: 'UTC' });
const fmtLong = k => fromKey(k).toLocaleDateString('en-GB', { weekday: 'long', day: 'numeric', month: 'long', timeZone: 'UTC' });
const fmtT = ms => new Date(ms + IST).toLocaleTimeString('en-US', { hour: 'numeric', minute: '2-digit', timeZone: 'UTC' });
const fmtDur = ms => { if (ms == null || isNaN(ms)) return '—'; const m = Math.max(0, Math.round(ms / MIN)); return Math.floor(m / 60) + ':' + String(m % 60).padStart(2, '0'); };
const hm = s => { const [h, m] = s.split(':').map(Number); return h * 60 + m; };

/* the prototype's own night: starts at 2:20 AM, you can fast-forward it */
let TODAY = '2026-09-30';
let SHIFT = addDays(TODAY, -1);                 // tonight's shift began the evening of SHIFT
const T = (hhmm) => { const [h, m] = hhmm.split(':').map(Number); return istMs(h >= 12 ? SHIFT : TODAY, h, m); };
let SIM0 = T('02:20'), REAL0 = Date.now(), FF = 0;
const now = () => IS_LIVE ? Date.now() + LIVE_OFF : SIM0 + (Date.now() - REAL0) + FF;
let MONTH = SHIFT.slice(0, 7);
const monthDays = () => { const a = []; for (let k = MONTH + '-01'; k.slice(0, 7) === MONTH; k = addDays(k, 1)) a.push(k); return a; };
let DATA_THROUGH = MONTH + '-' + String(DATA.thru).padStart(2, '0');
let MDAYS = new Date(Date.UTC(+MONTH.slice(0, 4), +MONTH.slice(5, 7), 0)).getUTCDate();

/* ── seeded sample data ── */
function rng(s) { return () => { s |= 0; s = s + 0x6D2B79F5 | 0; let t = Math.imul(s ^ s >>> 15, 1 | s); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
const DB = { dev: {}, att: {}, night: {}, off: {}, mails: [], sent: new Set(), esc: {}, hol: [{ k: '2026-10-02', name: 'Gandhi Jayanti' }, { k: '2026-11-08', name: 'Diwali' }], roster: {}, plog: [], devs: {}, targets: null, log: [] };
const isHol = k => DB.hol.some(h => h.k === k);
const wkOf = k => addDays(k, -((dow(k) + 6) % 7));            // Monday of that week
function planOf(id, k) {
  const p = (typeof PERSON === 'function' ? PERSON(id) : null) || IC(id); if (!p || p.isTL) return undefined;
  const R = (DB.roster[p.tl] || {})[wkOf(k)]; return R && R.plan[id] ? R.plan[id][k] : undefined;
}
const isOffDay = (id, k) => id.startsWith('tl-') ? DB.off[id] === dow(k) : planOf(id, k) === 'off';
const plannedAt = (id, k) => { const v = planOf(id, k); return v && /^\d\d:\d\d$/.test(v) ? v : null; };

function seed() {
  const r = rng(4242);
  const pick = a => a[Math.floor(r() * a.length)];
  const ri = (a, b) => a + Math.floor(r() * (b - a + 1));
  ICS.concat(TLP).forEach(ic => { DB.off[ic.id] = ri(0, 6); DB.att[ic.id] = {}; DB.night[ic.id] = { ev: [], plan: [], seen: null }; });
  /* weekly rosters: every Monday for September, plus this week; next week not in yet */
  const weeks = []; for (let w = wkOf(MONTH + '-01'); w <= wkOf(SHIFT); w = addDays(w, 7)) weeks.push(w);
  TLS.forEach(t => { DB.roster[t.id] = {}; weeks.forEach(w => {
    const plan = {}; icsOf(t.id).forEach(ic => { const off = ri(0, 6), st = r() < .8 ? '23:00' : pick(['22:30', '23:30', '21:00', '00:00']); plan[ic.id] = {};
      for (let i = 0; i < 7; i++) { const k = addDays(w, i); plan[ic.id][k] = i === off ? 'off' : r() < .02 ? 'leave' : st; } });
    const late = t.id === 'uday' && w === wkOf(SHIFT);
    DB.roster[t.id][w] = { plan, by: t.name, via: r() < .5 ? 'upload' : 'grid', at: istMs(w, late ? 9 : ri(1, 5), late ? 40 : ri(0, 59)) };
    if (late) { [0, 3, 6].forEach(h => DB.mails.push(rosterMail('rrem', t, w, istMs(w, h, 20)))); DB.mails.push(rosterMail('rmgr', t, w, istMs(w, 7, 0))); }
  }); });
  const P = icsOf('prabhu');
  const sagar = P.find(x => /^Sagar/.test(x.name)) || P[0];
  const cast = P.filter(x => x !== sagar);
  const role = {};   // curated cases on Prabhu's team, so the TL board shows every state
  ['overrun', 'wfh', 'notin', 'leave', 'weekoff', 'short', 'idle', 'early', 'onbreak'].forEach((c, i) => { if (cast[i]) role[cast[i].id] = c; });
  role[sagar.id] = 'me';
  if (cast[4]) DB.roster.prabhu[wkOf(SHIFT)].plan[cast[4].id][SHIFT] = 'off';
  { const W = DB.roster.prabhu[wkOf(SHIFT)].plan, keepOff = p => { if (W[p.id][SHIFT] === 'off') { W[p.id][SHIFT] = '23:00'; W[p.id][addDays(SHIFT, 2)] = 'off'; } };
    cast.forEach(c => { if (c !== cast[4]) keepOff(c); }); keepOff(sagar); }
  /* history: the month so far */
  ICS.forEach(ic => {
    const A = DB.att[ic.id];
    for (let k = MONTH + '-01'; k < SHIFT; k = addDays(k, 1)) {
      if (isHol(k)) { A[k] = { st: 'holiday' }; continue; }
      if (isOffDay(ic.id, k)) { A[k] = { st: 'weekoff' }; continue; }
      if (planOf(ic.id, k) === 'leave') { A[k] = { st: 'leave', reason: 'On the weekly roster', by: 'TL' }; continue; }
      const x = r();
      if (x < .03) A[k] = { st: 'leave', reason: pick(['Medical', 'Family function', 'Personal']), by: 'TL' };
      else if (x < .05) A[k] = { st: 'lop' };
      else if (x < .11) A[k] = { st: 'short', min: ri(390, 530) };
      else if (x < .12) A[k] = { st: 'excused', min: ri(270, 300), reason: 'Approved half day' };
      else A[k] = { st: 'complete', min: ri(540, 590) };
      if (['complete', 'short'].includes(A[k].st) && r() < .05) A[k].late = ri(16, 45);
    }
  });
  /* team leads tonight: 9 hours, no break rule */
  TLP.forEach((p, i) => { const N = DB.night[p.id], add = (t, type, x = {}) => (t <= SIM0 ? N.ev : N.plan).push({ t, type, ...x }); N.seen = SIM0 - MIN;
    for (let k = MONTH + '-01'; k < SHIFT; k = addDays(k, 1)) DB.att[p.id][k] = isHol(k) ? { st: 'holiday' } : isOffDay(p.id, k) ? { st: 'weekoff' } : { st: r() < .06 ? 'short' : 'complete', min: ri(500, 570) };
    if (isOffDay(p.id, SHIFT)) { DB.att[p.id][SHIFT] = { st: 'weekoff' }; return; }
    add(T('22:' + String(ri(20, 50)).padStart(2, '0')), 'in', { mode: 'office' }); add(i === 1 ? T('05:40') : T('07:' + String(ri(40, 59)).padStart(2, '0')), 'out'); });
  /* the short-shift case already has two short working days in a row */
  const sc = cast[5];
  if (sc) { let k = addDays(SHIFT, -1), n = 0; while (n < 2) { if (!isHol(k) && !isOffDay(sc.id, k)) { DB.att[sc.id][k] = { st: 'short', min: 470 + n * 25 }; n++; } k = addDays(k, -1); } }
  /* tonight */
  ICS.forEach(ic => {
    const N = DB.night[ic.id], c = role[ic.id] || (ic.tl === 'prabhu' ? 'normal' : pick(['normal', 'normal', 'normal', 'normal', 'normal', 'normal', 'onbreak', 'normal', 'normal', 'normal', 'wfh', 'normal', 'normal', 'normal', 'notin']));
    const pl = plannedAt(ic.id, SHIFT) || '23:00', plMs = T(pl);
    const inAt = r() < .1 ? plMs + ri(16, 40) * MIN : plMs - ri(1, 18) * MIN;
    const add = (t, type, x = {}) => (t <= SIM0 ? N.ev : N.plan).push({ t, type, ...x });
    N.seen = SIM0 - ri(1, 4) * MIN;
    if (isOffDay(ic.id, SHIFT)) { DB.att[ic.id][SHIFT] = { st: 'weekoff' }; return; }
    if (planOf(ic.id, SHIFT) === 'leave') { DB.att[ic.id][SHIFT] = { st: 'leave', reason: 'On the weekly roster', by: 'TL' }; return; }
    switch (c) {
      case 'me': break;
      case 'overrun': add(inAt, 'in', { mode: 'office' }); add(T('01:05'), 'bs'); add(T('02:31'), 'be'); add(T('08:40'), 'out'); break;
      case 'wfh': add(T('19:05'), 'in', { mode: 'wfh' }); add(T('21:40'), 'mode', { mode: 'office' }); add(T('00:30'), 'bs'); add(T('01:10'), 'be'); add(T('04:30'), 'out'); break;
      case 'notin': break;
      case 'leave': DB.att[ic.id][SHIFT] = { st: 'leave', reason: 'Medical', by: 'Prabhu G' }; break;
      case 'weekoff': DB.att[ic.id][SHIFT] = { st: 'weekoff' }; break;
      case 'short': add(T('22:58'), 'in', { mode: 'office' }); add(T('00:20'), 'bs'); add(T('00:45'), 'be'); add(T('03:05'), 'out'); break;
      case 'idle': { const k0 = Object.keys(DB.att[ic.id]).find(k => DB.att[ic.id][k].st === 'complete'); if (k0) DB.att[ic.id][k0].late = 22; } add(T('23:24'), 'in', { mode: 'office' }); add(T('00:10'), 'bs'); add(T('00:52'), 'be'); add(T('08:10'), 'out'); N.seen = T('01:33'); N.idle = true; break;
      case 'early': add(T('17:10'), 'in', { mode: 'office' }); add(T('21:00'), 'bs'); add(T('21:40'), 'be'); break;
      case 'onbreak': add(inAt, 'in', { mode: 'office' }); add(T('02:05'), 'bs'); add(T('02:42'), 'be'); add(T('08:' + String(ri(0, 25)).padStart(2, '0')), 'out'); break;
      default: { add(inAt, 'in', { mode: r() < .1 ? 'wfh' : 'office' }); const bs = T('0' + ri(0, 1) + ':' + String(ri(0, 59)).padStart(2, '0'));
        add(bs, 'bs'); add(bs + ri(15, 50) * MIN, 'be'); add(T('08:' + String(ri(0, 30)).padStart(2, '0')), 'out'); }
    }
    N.ev.sort((a, b) => a.t - b.t); N.plan.sort((a, b) => a.t - b.t);
  });
  seedTargets(); seedAudits(); seedShouts();
  /* one escalation already sent earlier this month, on Naeem's team */
  const ez = icsOf('naeem').slice().sort((x, y) => numsOf(x).att - numsOf(y).att)[0];
  if (ez) { let k = MONTH + '-12', n = 0; const days = []; while (n < 3) { if (!isHol(k) && !isOffDay(ez.id, k)) { DB.att[ez.id][k] = { st: 'short', min: 480 - n * 20 }; days.push(k); n++; } k = addDays(k, 1); }
    DB.esc[ez.id] = days[2]; mail('esc', ez, days[2], { at: istMs(addDays(days[2], 1), 9, 4), days, why: 'three working days in a row' }); }
  tick(true);
}
const sum = a => a.reduce((x, y) => x + y, 0);

function shiftOf(ic) {
  const N = DB.night[ic.id], t = now();
  while (N.plan.length && N.plan[0].t <= t) N.ev.push(N.plan.shift());
  let inT = null, outT = null, auto = false; const br = [], modes = [];
  N.ev.forEach(e => {
    if (e.type === 'in') { inT = e.t; modes.push({ t: e.t, m: e.mode }); }
    else if (e.type === 'mode') modes.push({ t: e.t, m: e.mode });
    else if (e.type === 'bs') br.push({ s: e.t, e: null });
    else if (e.type === 'be' && br.length) br[br.length - 1].e = e.t;
    else if (e.type === 'out') { outT = e.t; auto = !!e.auto; }

function trendSVG(f) {
  const N = MDAYS, W = 640, H = 170, P = 22, d = f.d, u = f.u;
  const md = Math.max(1, ...d), mu = Math.max(1, ...u), bw = (W - P * 2) / N;
  const bars = d.map((v, i) => `<rect class="b" x="${P + i * bw + 1}" y="${H - P - v / md * (H - P * 2)}" width="${bw - 2}" height="${v / md * (H - P * 2)}" rx="2"><title>${fmtDay(MONTH + '-' + String(i + 1).padStart(2, '0'))}: ${v} demos, ${fmt1(u[i])} units</title></rect>`).join('');
  const pts = u.slice(0, DATA.thru).map((v, i) => `${P + i * bw + bw / 2},${H - P - v / mu * (H - P * 2)}`).join(' ');
  const ax = [1, 8, 15, 22, 29].map(dd => `<text class="ax" x="${P + (dd - 1) * bw + bw / 2}" y="${H - 6}" text-anchor="middle">${dd}</text>`).join('');
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" role="img" aria-label="Daily demos and units">${bars}<polyline class="l" points="${pts}"/>${ax}</svg>
    <div class="tleg"><span><i style="background:var(--accent-line)"></i>Demos per day</span><span><i style="background:var(--pos)"></i>Units enrolled per day</span></div>`;
}
function breakdown(list) {

  const arr = Object.entries(f.dims[S.dim] || {}).sort((a, b) => b[1][0] - a[1][0]), tot = sum(arr.map(r => r[1][0]));

function boardRows(list, type, meIdv) {

    return `<tr class="${r.ic.id === meIdv ? 'me' : ''}${extra ? ' dim' : ''}"><td class="n">${own ? i + 1 : ''}</td><td><span class="tl-n"><span class="av">${initials(r.ic.name)}</span>${esc(r.ic.name)}</span></td><td>${esc(TL(r.ic.tl).name)}</td>

const gband = g => { const n = parseInt(g, 10); if (g === 'UKG' || n <= 2) return 'UKG–2'; if (n <= 5) return '3–5'; if (n <= 8) return '6–8'; if (n >= 9) return '9+'; return null; };

<script>
/* ════════════════ MONTH ON MONTH (history + this month) ════════════════ */
const MO = DATA.months, MSHORT = m => fromKey(m + '-01').toLocaleDateString('en-GB', { month: 'short', timeZone: 'UTC' });
const pad2 = n => String(n).padStart(2, '0');
const DFIRST = () => MO[0] + '-01', DLAST = () => MO[DATA.cur] + '-' + pad2(DATA.thru);
const sd = k => fromKey(k).toLocaleDateString('en-GB', { day: 'numeric', month: 'short', timeZone: 'UTC' });
const monthEnd = m => key(new Date(Date.UTC(+m.slice(0, 4), +m.slice(5, 7), 0)));
function periods() {

  const days = Math.round((fromKey(b) - fromKey(a)) / DAY) + 1, weekly = days <= 62, list = [];
  if (weekly) for (let w = wkOf(a); w <= b; w = addDays(w, 7)) { const f = w < a ? a : w, t = addDays(w, 6) > b ? b : addDays(w, 6); list.push({ from: f, to: t, label: f === t ? sd(f) : f.slice(0, 7) === t.slice(0, 7) ? +f.slice(8) + '–' + sd(t) : sd(f) + '–' + sd(t), short: sd(f) }); }
  else for (let m = a.slice(0, 7); m <= b.slice(0, 7); m = addDays(monthEnd(m), 1).slice(0, 7)) { const f = m + '-01' < a ? a : m + '-01', t = monthEnd(m) > b ? b : monthEnd(m), full = f === m + '-01' && t === monthEnd(m);
    list.push({ from: f, to: t, label: MSHORT(m) + (full ? '' : ' ' + +f.slice(8) + '–' + +t.slice(8)), short: MSHORT(m) }); }

const rowKey = r => MO[r[0]] + '-' + pad2(r[1]);
let PER = null;   // periods for the view being drawn
const mLabel = i => PER.list[i].label;

<script>

const NUMBER_VIEWS = ['nums', 'mom', 'fu', 'board', 'targets'];   // Phase 2: shown once the numbers load
const tstore = { get: k => { try { return JSON.parse(localStorage.getItem(k)); } catch (e) { return null; } }, set: (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) { } }, del: k => { try { localStorage.removeItem(k); } catch (e) { } } };

    const j = await r.json(); if (j && j.auth === false) tsignOut(true);

}

const MAIL_MAP = { Short: 'short', Break: 'ovr', Late: 'late', LOP: 'lop', 'LOP reversed': 'rev', 'Floor vs roster': 'dev', 'Roster reminder': 'rrem', 'Roster missing': 'rmgr' };

function whoName() { const r = role(); return r === 'tl' ? TL(meId()).name : r === 'mgr' ? MGRS[meId()].name : r === 'admin' ? (ADMINS.find(x => x.id === meId()) || ADMIN).name : ''; }
function parseT(v) { if (!v) return null; const [h, m] = v.split(':').map(Number); return T(`${String(h).padStart(2, '0')}:${String(m).padStart(2, '0')}`); }

/* ════════════════ overlays & feedback ════════════════ */
function modal(title, body) { $('overlay').innerHTML = `<div class="scrim" data-act="close-bg"><div class="modal" role="dialog" aria-modal="true" aria-label="${esc(title)}"><div class="mh"><h2>${title}</h2><button class="x" data-act="close" aria-label="Close">×</button></div><div class="mb">${body}</div></div></div>`; }
function closeModal() { $('overlay').innerHTML = ''; }
function mailLog() {
  const ids = new Set(scope().map(x => x.id).concat(role() === 'ic' ? [] : scopeTLs().map(t => 'tl-' + t.id))), tlids = new Set(scopeTLs().map(t => t.id)), ms = IS_LIVE ? DB.mails : DB.mails.filter(m => m.type === 'shout' || (m.ic ? ids.has(m.ic) : tlids.has(m.tl))), sel = ms[S.mailSel] || ms[0];
  const tag = { ovr: '<span class="tag rem">Break</span>', short: '<span class="tag lop">Short</span>', lop: '<span class="tag lop">LOP</span>', rev: '<span class="tag rev">Reversed</span>', esc: '<span class="tag lop" style="background:var(--neg);color:#fff">Warning</span>', tgt: '<span class="tag rev">Target</span>', late: '<span class="tag rem">Late</span>', dev: '<span class="tag lop">Floor vs roster</span>', rrem: '<span class="tag rem">Roster reminder</span>', rmgr: '<span class="tag lop">Roster missing</span>', shout: '<span class="tag" style="background:var(--pos-bg);color:var(--pos)">100%</span>', pace: '<span class="tag rem">Pace</span>', tgtl: '<span class="tag rev">TL target</span>' };
  modal('Mail log', !ms.length ? '<p class="note">No mails yet.</p>' : `<div class="mails"><div class="mlist">${ms.map((m, i) => `<button class="mi${m === sel ? ' on' : ''}" data-act="mail" data-i="${i}"><b>${esc(m.name || (m.ic ? PERSON(m.ic).name : TL(m.tl).name))}${tag[m.type] || `<span class="tag" style="background:var(--paper);color:var(--mute)">${esc(m.raw || '')}</span>`}</b><span>${fmtDay(key(new Date(m.at + IST)))} ${fmtT(m.at)}</span></button>`).join('')}</div>
    <div class="mail"><div class="hdr"><div><span>From</span>${IS_LIVE ? 'Business Command Centre' : ADMIN.email}</div><div><span>To</span>${esc(sel.to)}</div><div><span>Cc</span>${esc(sel.cc.join(', '))}</div><div class="subj">${esc(sel.subject)}</div></div><div class="bd">${esc(sel.body)}</div></div></div>`);
}
function onPace(behind) {
  if (role() === 'ic') { if (behind.some(x => x.id === meId())) toast('Pace check: you’re behind where you should be by today. See the note on My shift.'); }
  else { const ids = new Set(scope().map(x => x.id)), n = behind.filter(x => ids.has(x.id)).length; toast(`3 AM pace check: ${n} ${role() === 'tl' ? 'of your team' : 'people'} behind target.${n ? ' Team leads emailed.' : ''}`); }
  render();
}
function onMails(ms) {
  const ids = new Set(scope().map(x => x.id).concat(role() === 'tl' ? ['tl-' + meId()] : role() === 'ic' ? [] : scopeTLs().map(t => 'tl-' + t.id))), tlids = new Set(role() === 'ic' ? [] : scopeTLs().map(t => t.id)), mine = ms.filter(m => m.ic ? ids.has(m.ic) : tlids.has(m.tl));
  if (!mine.length) return;
  const w = { late: 'Late clock-in', dev: 'Floor below roster', ovr: 'Break over 1 hour', short: 'Short shift', lop: 'LOP', rev: 'LOP reversed', esc: 'Formal warning' };
  toast(mine.map(m => `${w[m.type]} mail sent: ${m.ic ? PERSON(m.ic).name : TL(m.tl).name + '’s team'}${m.type === 'esc' ? ' (admin copied)' : ''}`).join(' · '));
}
let toastT;
function toast(msg) { clearTimeout(toastT); document.querySelectorAll('.toast').forEach(x => x.remove()); const el = document.createElement('div'); el.className = 'toast'; el.setAttribute('role', 'status'); el.textContent = msg; document.body.appendChild(el); toastT = setTimeout(() => el.remove(), 5200); }
function countUp() { if (REDUCED) return; document.querySelectorAll('[data-count]').forEach(el => { const to = +el.dataset.count; if (!to) return; const t0 = performance.now(), f = t => { const p = Math.min(1, (t - t0) / 700); el.textContent = Math.round(to * (1 - Math.pow(1 - p, 3))).toLocaleString('en-IN'); if (p < 1) requestAnimationFrame(f); }; requestAnimationFrame(f); }); }
function confetti() {
  if (REDUCED) return; const c = $('confetti'), x = c.getContext('2d'), W = c.width = innerWidth, H = c.height = innerHeight;
  const cols = ['#0d7550', '#1668b3', '#a4640f', '#6f4e9c', '#a8cbe9'];
  const ps = Array.from({ length: 100 }, () => ({ x: W / 2 + (Math.random() - .5) * 200, y: H * .35, vx: (Math.random() - .5) * 14, vy: -Math.random() * 13 - 4, s: 4 + Math.random() * 5, r: Math.random() * 6, vr: (Math.random() - .5) * .3, c: cols[Math.floor(Math.random() * 5)] }));
  const t0 = performance.now(); (function fr(t) { x.clearRect(0, 0, W, H); ps.forEach(p => { p.vy += .42; p.x += p.vx; p.y += p.vy; p.r += p.vr; x.save(); x.translate(p.x, p.y); x.rotate(p.r); x.fillStyle = p.c; x.fillRect(-p.s / 2, -p.s / 4, p.s, p.s / 2); x.restore(); }); if (t - t0 < 2000) requestAnimationFrame(fr); else x.clearRect(0, 0, W, H); })(t0);
}

/* ════════════════ events ════════════════ */
document.addEventListener('click', ev => {
  const el = ev.target.closest('[data-act]'); if (!el) return;
  const a = el.dataset.act;
  if (a === 'close-bg' && ev.target !== el) return;
  switch (a) {
    case 'view': S.view = el.dataset.v; closeModal(); render(); scrollTo(0, 0); break;
    case 'ff': FF += +el.dataset.m * MIN; toast(`Night moved forward ${el.dataset.m >= 60 ? el.dataset.m / 60 + ' h' : el.dataset.m + ' min'}: it’s now ${fmtT(now())}.`); tick(); render(); break;
    case 'phone': S.phone = !S.phone; render(); toast(S.phone ? 'Simulating a phone: breaks are blocked.' : 'Back to laptop.'); break;
    case 'me': meAct(el.dataset.x, el.dataset.m); break;
    case 'dim': S.dim = el.dataset.v; render(); break;
    case 'lb': S.lb = el.dataset.v; render(); break;
    case 'ic': icDrawer(el.dataset.id); break;
    case 'day': dayDrawer(el.dataset.id, el.dataset.k); break;
    case 'mark': applyMark(el.dataset.id, el.dataset.k); break;
    case 'fixIn': { const ic = PERSON(el.dataset.id), t = parseT($('ci').value), was = tonight(ic).st; const N = DB.night[ic.id]; N.plan = []; N.ev = [{ t, type: 'in', mode: $('cm').value }]; N.seen = now(); DB.sent.delete('lop:' + ic.id); delete DB.att[ic.id][SHIFT];
      if (was === 'lop') onMails([mail('rev', ic, SHIFT, { how: `${whoName()} clocked you in at ${fmtT(t)}` })]); closeModal(); render(); toast(`${ic.name} clocked in at ${fmtT(t)} by ${whoName()}.`); break; }
    case 'fixTimes': { const ic = PERSON(el.dataset.id), N = DB.night[ic.id], ti = parseT($('ci').value), to = parseT($('co').value); N.plan = [];
      N.ev = N.ev.filter(e => e.type !== 'out'); N.ev.forEach(e => { if (e.type === 'in') e.t = ti; }); if (to) N.ev.push({ t: to, type: 'out' }); N.ev.sort((x, y) => x.t - y.t);
      DB.sent.delete('short:' + ic.id); delete DB.att[ic.id][SHIFT]; tick(); closeModal(); render(); toast(`Times corrected for ${ic.name}.`); break; }
    case 'split': evenSplit(meId()); render(); break;
    case 'saveSplit': { const t = TL(meId()); if (!splitOK(t.id)) return toast('Both splits must add up first.');
      const L = icsOf(t.id); L.forEach(ic => targetMailIC(ic, `${t.name} (Team Lead)`));
      DB.targets.hist.push({ at: now(), by: whoName(), text: `Saved the team split (${L.filter(x => typeOf(x) === 'RP').length} RP, ${L.filter(x => typeOf(x) === 'OTP').length} OTP) and emailed ${L.length} team members` });
      const sh = checkShouts(); toast(`Saved. ${L.length} team members emailed their targets.${sh.length ? ` ${sh.map(x => x.name).join(', ')} crossed 100%: the floor has been emailed.` : ''}`); render(); break; }
    case 'saveTL': { const by = whoName(); let sent = 0; const all = [];
      scopeTLs().forEach(t => { const tg = DB.targets.tl[t.id], ch = [];
        const rv = +(document.querySelector(`[data-tlr="${t.id}"]`) || {}).value, dv = +(document.querySelector(`[data-tld="${t.id}"]`) || {}).value, ov = +(document.querySelector(`[data-tlo="${t.id}"]`) || {}).value;
        if (rv >= 0 && rv !== tg.rp) { ch.push(`RP ${fmt1(tg.rp)} → ${fmt1(rv)} units`); tg.rp = rv; }
        if (dv > 0 && dv !== tg.dc2e) { ch.push(`DC2E ${tg.dc2e}% → ${dv}%`); tg.dc2e = dv; }
        if (ov >= 0 && ov !== tg.otp) { ch.push(`OTP ${lakh(tg.otp)} → ${lakh(ov)}`); tg.otp = ov; }
        if (ch.length) { targetMailTL(t, ch.join('; '), by + ' (Manager)'); sent++; all.push(`${t.name}: ${ch.join(', ')}`); } });
      if (sent) { DB.targets.hist.push({ at: now(), by, text: all.join(' · ') }); toast(`Saved. ${sent} team lead${sent > 1 ? 's' : ''} emailed their new targets.`); } else toast('No changes to save.');
      render(); break; }
    case 'flt': S[el.dataset.k] = el.dataset.v; render(); break;
    case 'lbt': S.lbType = el.dataset.v; render(); break;
    case 'lbs': S.lbSale = el.dataset.v; render(); break;
    case 'holAdd': { const k = $('hk').value, n = $('hn').value.trim(); if (!k || !n) return toast('Add a date and a name.'); DB.hol.push({ k, name: n }); render(); toast(`${n} added.`); break; }
    case 'holDel': DB.hol = DB.hol.filter(h => h.k !== el.dataset.k); render(); break;
    case 'fu': fuModal({ s: el.dataset.s, ic: el.dataset.ic, h: el.dataset.h }); break;
    case 'rday': { const ic = PERSON(el.dataset.id), k = el.dataset.k, R = (DB.roster[ic.tl] || {})[wkOf(k)]; if (R) { R.plan[ic.id][k] = $('rv').value; if ((DB.att[ic.id][k] || {}).st === 'weekoff' && $('rv').value !== 'off') delete DB.att[ic.id][k]; } closeModal(); render(); toast('Roster changed.'); break; }
    case 'resetDev': DB.dev[el.dataset.id] = null; closeModal(); toast(`Laptop reset for ${PERSON(el.dataset.id).name}. The next laptop they mark present from is registered.`); break;
    case 'copy': (navigator.clipboard ? navigator.clipboard.writeText(el.dataset.v) : Promise.reject()).then(() => toast('Lead ID copied.'), () => toast(el.dataset.v)); break;
    case 'mails': S.mailSel = 0; mailLog(); break;
    case 'mail': S.mailSel = +el.dataset.i; mailLog(); break;
    case 'close': case 'close-bg': closeModal(); break;
  }
});
document.addEventListener('input', ev => {
  const i = ev.target;
  if (i.dataset.tg) {
    DB.targets.ic[i.dataset.tg].v = +i.value || 0;
    $('sums').innerHTML = sumLines(meId()); $('saveSplit').disabled = !splitOK(meId());
  }
});
document.addEventListener('click', ev => {
  if (ev.target.closest && ev.target.closest('[data-tlc-clear]')) { S.tlF = 'all'; S.tlOpen = true; render(); S.tlOpen = false; return; }
  if (ev.target.closest && ev.target.closest('[data-srcc-clear]')) { S.srcF = 'all'; S.srcOpen = true; render(); S.srcOpen = false; return; }
  document.querySelectorAll('details.tlpick[open]').forEach(d => { if (!d.contains(ev.target)) d.removeAttribute('open'); });
});
document.addEventListener('keydown', ev => { if (ev.key === 'Escape') document.querySelectorAll('details.tlpick[open]').forEach(d => d.removeAttribute('open')); });
document.addEventListener('change', ev => {
  if (ev.target.id === 'asUser') { S.as = ev.target.value; S.view = null; S.tlF = 'all'; S.typeF = 'all'; S.lbType = null; closeModal(); render(); scrollTo(0, 0); }
  if (ev.target.dataset.srcc) {
    const v = ev.target.dataset.srcc;
    if (v === 'all') S.srcF = 'all';
    else { let cur = S.srcF === 'all' ? [] : S.srcF.slice(); cur = ev.target.checked ? cur.concat(v) : cur.filter(x => x !== v); S.srcF = cur.length && cur.length < srcList().length ? cur : 'all'; }
    S.srcOpen = true; render(); S.srcOpen = false;
  }
  if (ev.target.dataset.tlc) {
    const id = ev.target.dataset.tlc;
    if (id === 'all') S.tlF = 'all';
    else { let cur = S.tlF === 'all' ? [] : S.tlF.slice(); cur = ev.target.checked ? cur.concat(id) : cur.filter(x => x !== id); S.tlF = cur.length && cur.length < scopeTLs().length ? cur : 'all'; }
    S.tlOpen = true; render(); S.tlOpen = false;
  }
  if (ev.target.dataset.tt) { const tg = DB.targets.ic[ev.target.dataset.tt]; tg.type = ev.target.value; tg.v = 0; render(); toast('Target type changed. Re-enter the target or use Split evenly.'); }
});
document.addEventListener('keydown', ev => { if (ev.key === 'Escape') closeModal(); });

/* live: rules every second; light refresh of the open view */
setInterval(() => {
  tick();
  $('simt').textContent = fmtT(now());
  if ($('overlay').innerHTML) return;
  if (S.view === 'shift') {
    const s = shiftOf(role() === 'tl' ? PERSON('tl-' + meId()) : IC(meId()));
    if (sig() !== S.sig) return render();
    if ($('bigH')) { $('bigH').textContent = fmtDur(s.credited); $('bigB').textContent = fmtDur(s.brMs) + ' / 1:00 break'; }
  } else if (['now', 'exc'].includes(S.view) && sig() !== S.sig) render();
}, 1000);

/* boot */
if (!IS_LIVE && !ICS.length && !KEYS_MISSING) {
  /* opened outside the website (a preview or a downloaded copy): there is no sample data to show */
  document.querySelector('.proto').style.display = 'none';
  $('view').innerHTML = `<section class="panel" style="max-width:620px;margin:40px auto"><div class="ph"><h2>Open this page from the website</h2></div><div class="pb">
    <p>This is the live Team page. It only works when opened from bhanzudashboard.github.io/businesscommandcenter/team.html, where it connects to your sheet and asks you to sign in. A preview or a copy opened from your computer has no data to show.</p></div></section>`;
} else if (KEYS_MISSING) {
  document.querySelector('.proto').style.display = 'none';
  $('view').innerHTML = `<section class="panel" style="max-width:620px;margin:40px auto"><div class="ph"><h2>The Team page can’t connect yet</h2></div><div class="pb">
    <p>It couldn’t find the web app link and sign-in ID it needs. Open <b>team.html</b> on GitHub, click the pencil, search for <b>const LIVE</b>, and paste the same two values that are in kra.html between the quotes after <b>ENDPOINT:</b> and <b>CLIENT_ID:</b>. Then commit, wait two minutes and press Cmd + Shift + R.</p></div></section>`;
} else if (IS_LIVE) tliveBoot(); else {
seed();
const sagar = ICS.find(x => /^Sagar/.test(x.name)) || icsOf('prabhu')[0];
const otpIC = icsOf('umar')[0], slow = icsOf('prabhu').filter(x => x !== sagar).find(x => paceOf(x).behind && tonight(x).st === 'working');
$('asUser').innerHTML = `<optgroup label="SMs">${[sagar, otpIC, slow].filter(Boolean).filter((x, i, a) => a.indexOf(x) === i).map(x => `<option value="ic:${x.id}">${esc(x.name)} (${x.home}${x === slow ? ', behind pace' : ''})</option>`).join('')}</optgroup>
  <optgroup label="Team leads">${TLS.map(t => `<option value="tl:${t.id}">${esc(t.name)}</option>`).join('')}</optgroup>
  <optgroup label="Managers">${Object.entries(MGRS).map(([k, m]) => `<option value="mgr:${k}">${esc(m.name)}</option>`).join('')}</optgroup>
  <optgroup label="Admins">${ADMINS.map(x => `<option value="admin:${x.id}">${esc(x.name)} (${x.sup ? 'Super admin' : 'Admin'})</option>`).join('')}</optgroup>`;
S.as = 'ic:' + sagar.id;
render();
}
</script>
