<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Predictive Outlook</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#f4f7fa;--surface:#ffffff;--raised:#fbfcfe;--line:#dce5ed;--line2:#c6d4e0;
  --ink:#0e1d2a;--mute:#57708a;--dim:#8fa4b8;
  --accent:#1668b3;--accent-soft:#e8f1fa;--accent-line:#a8cbe9;
  --pos:#0d7550;--pos-bg:#e4f3ec;--warn:#a4640f;--warn-bg:#fbeed8;--neg:#b8382a;--neg-bg:#fbe6e2;
  --ctx:#c3ceda;--fc:#a8cbe9;
  --shadow:0 1px 2px rgba(14,29,42,.05),0 8px 24px -16px rgba(14,29,42,.18);
  --mono:'IBM Plex Mono',ui-monospace,SFMono-Regular,Menlo,monospace;
  --display:'Bricolage Grotesque','Inter',system-ui,sans-serif;
  --body:'Inter',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  color-scheme:light
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --paper:#0b131b;--surface:#111b25;--raised:#15212d;--line:#223241;--line2:#2e4254;
  --ink:#e4edf5;--mute:#93a8bb;--dim:#62788c;
  --accent:#62a8e8;--accent-soft:#122a40;--accent-line:#285680;
  --pos:#4cc395;--pos-bg:#0e2a20;--warn:#e2a654;--warn-bg:#2d2313;--neg:#ee7e70;--neg-bg:#341b18;
  --ctx:#3a4d60;--fc:#285680;color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#0b131b;--surface:#111b25;--raised:#15212d;--line:#223241;--line2:#2e4254;
  --ink:#e4edf5;--mute:#93a8bb;--dim:#62788c;
  --accent:#62a8e8;--accent-soft:#122a40;--accent-line:#285680;
  --pos:#4cc395;--pos-bg:#0e2a20;--warn:#e2a654;--warn-bg:#2d2313;--neg:#ee7e70;--neg-bg:#341b18;
  --ctx:#3a4d60;--fc:#285680;color-scheme:dark}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--paper);color:var(--ink);font-family:var(--body);font-size:13.5px;line-height:1.5;-webkit-font-smoothing:antialiased}
.wrap{max-width:1180px;margin:0 auto;padding:18px 16px 60px}
.apptabs{background:#0e1d2a;display:flex;align-items:flex-end;gap:2px;padding:8px 22px 0;overflow-x:auto}
.apptabs a{color:#b9c8d6;text-decoration:none;font:500 12.5px/1.5 var(--body);padding:8px 16px 9px;border-radius:8px 8px 0 0;white-space:nowrap}
.apptabs a:hover{color:#fff;background:rgba(255,255,255,.06)}
.apptabs a.on{background:var(--paper);color:var(--ink);font-weight:600}
@media(max-width:640px){.apptabs{padding:6px 10px 0}}
.top{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:14px}
.top .brand{font-family:var(--display);font-weight:700;font-size:15px}
.top .note{margin-left:auto}
.note{color:var(--mute);font-size:12px}
.mono{font-family:var(--mono)}
h1{font-family:var(--display);font-size:26px;font-weight:700;letter-spacing:-.022em;line-height:1.15}
h2{font-family:var(--display);font-size:18px;font-weight:700;letter-spacing:-.01em;line-height:1.25}
h3{font-size:13px;font-weight:600}
.sub{color:var(--mute);margin-top:6px;max-width:820px}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line2);background:var(--surface);color:var(--ink);border-radius:999px;padding:4px 11px;font:500 12.5px var(--body);cursor:pointer}
.chip.on{background:var(--ink);border-color:var(--ink);color:var(--paper)}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);margin-top:16px}
.ph{padding:16px 18px 6px}
.ph .kick{font:600 11px var(--mono);letter-spacing:.06em;text-transform:uppercase;color:var(--dim);margin-bottom:4px}
.pb{padding:8px 18px 18px}
.hero{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px;margin-top:14px}
.tile{border:1px solid var(--line);border-radius:12px;padding:14px;background:var(--raised)}
.tile .lab{font:600 11px var(--mono);letter-spacing:.05em;text-transform:uppercase;color:var(--mute)}
.tile .big{font-family:var(--display);font-size:30px;font-weight:700;letter-spacing:-.02em;margin-top:2px}
.tile .rng{color:var(--mute);font-size:12.5px}
.prog{position:relative;height:14px;border-radius:7px;background:var(--line);margin:24px 0 8px;overflow:visible}
.prog .bk{position:absolute;left:0;top:0;bottom:0;border-radius:7px 0 0 7px;background:var(--accent)}
.prog .fc{position:absolute;top:0;bottom:0;background:var(--fc)}
.prog .rg{position:absolute;top:-3px;bottom:-3px;border:1.5px dashed var(--mute);border-radius:4px}
.prog .tg{position:absolute;top:-6px;bottom:-6px;width:2px;background:var(--ink)}
.prog .tg span{position:absolute;top:-17px;left:50%;transform:translateX(-50%);font:600 10.5px var(--mono);white-space:nowrap;color:var(--ink)}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:11.5px;color:var(--mute);margin-top:6px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}
.kv{display:flex;gap:18px;flex-wrap:wrap;margin-top:8px;font-size:12.5px}
.kv b{font-weight:600}
.pos{color:var(--pos)}.neg{color:var(--neg)}.warnc{color:var(--warn)}
.ai{margin-top:14px;border-left:3px solid var(--accent);background:var(--accent-soft);border-radius:0 10px 10px 0;padding:12px 14px}
.ai .t{font-weight:600}
.ai ul{margin:6px 0 0 18px}
.warns{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.w{border:1px solid var(--line);border-radius:12px;padding:12px 14px;background:var(--raised);position:relative}
.w .sev{display:inline-flex;align-items:center;gap:5px;font:600 10.5px var(--mono);letter-spacing:.04em;text-transform:uppercase;border-radius:6px;padding:1px 7px}
.sev.high{background:var(--neg-bg);color:var(--neg)}.sev.med{background:var(--warn-bg);color:var(--warn)}.sev.info{background:var(--accent-soft);color:var(--accent)}
.w .area{font:500 11px var(--mono);color:var(--dim);margin-left:6px}
.w .tt{font-weight:600;margin-top:6px}
.w .ev{color:var(--mute);font-size:12.5px;margin-top:3px}
.w .fix{margin-top:8px;font-size:12.5px;padding-top:8px;border-top:1px dashed var(--line2)}
.w .fix b{font-weight:600}
.w .own{font-size:11.5px;color:var(--dim);margin-top:6px}
svg{display:block;max-width:100%;overflow:visible}
svg text{font-family:var(--body);fill:var(--mute);font-size:11px}
.tbl{width:100%;border-collapse:collapse;font-size:12.5px}
.tbl th{text-align:left;font:600 11px var(--mono);letter-spacing:.03em;text-transform:uppercase;color:var(--dim);padding:7px 8px;border-bottom:1px solid var(--line2);white-space:nowrap;cursor:pointer;user-select:none}
.tbl td{padding:7px 8px;border-bottom:1px solid var(--line);vertical-align:middle}
.tbl td.n,.tbl th.n{text-align:right;font-variant-numeric:tabular-nums}
.tbl tr.me td{background:var(--accent-soft)}
.tbl tr.sub td{font-size:12px;color:var(--mute);background:var(--raised)}
.tw{overflow-x:auto;-webkit-overflow-scrolling:touch}
.bar{position:relative;height:10px;border-radius:5px;background:var(--line);min-width:120px}
.bar .f{position:absolute;left:0;top:0;bottom:0;border-radius:5px}
.bar .t{position:absolute;top:-3px;bottom:-3px;width:2px;background:var(--ink)}
.pill{display:inline-block;font:600 11px var(--mono);border-radius:6px;padding:1px 7px}
.pill.g{background:var(--pos-bg);color:var(--pos)}.pill.a{background:var(--warn-bg);color:var(--warn)}.pill.r{background:var(--neg-bg);color:var(--neg)}.pill.x{background:var(--line);color:var(--mute)}
.why{display:flex;gap:4px;flex-wrap:wrap}
.why span{font-size:11px;border:1px solid var(--line2);border-radius:6px;padding:0 6px;color:var(--mute);white-space:nowrap}
.filters{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:10px}
select,input[type=range]{font:13px var(--body);color:var(--ink)}
select{border:1px solid var(--line2);border-radius:8px;padding:5px 8px;background:var(--surface)}
.btn{border:1px solid var(--line2);background:var(--surface);border-radius:8px;padding:5px 11px;font:500 12.5px var(--body);color:var(--ink);cursor:pointer}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}.grid2>*,.hero>*,.warns>*{min-width:0}
.tbl td.mono .note{font-family:var(--body)}
.tbl.mk td{white-space:nowrap}
.sl{display:grid;grid-template-columns:150px 1fr 70px;gap:10px;align-items:center;margin:10px 0}
.sl output{font:600 13px var(--mono);text-align:right}
.res{font-family:var(--display);font-size:22px;font-weight:700}
.tip{position:fixed;pointer-events:none;background:var(--ink);color:var(--paper);font-size:12px;border-radius:8px;padding:6px 9px;z-index:50;display:none;max-width:260px;line-height:1.4}
.gate{max-width:420px;margin:12vh auto;text-align:center}
.gate p{color:var(--mute);margin:10px 0 18px}
#gbtn{display:inline-block}
details{margin-top:10px}
summary{cursor:pointer;font-weight:600;font-size:12.5px;color:var(--accent)}
.method p{margin-top:8px;color:var(--mute);max-width:860px}
.empty{padding:18px;border:1px dashed var(--line2);border-radius:12px;color:var(--mute)}
.seg{display:inline-flex;border:1px solid var(--line2);border-radius:8px;overflow:hidden}
.seg button{border:0;background:var(--surface);padding:4px 10px;font:500 12px var(--body);color:var(--mute);cursor:pointer}
.seg button.on{background:var(--ink);color:var(--paper)}
@media (max-width:780px){.hero,.warns,.grid2{grid-template-columns:minmax(0,1fr)}h1{font-size:21px}.tile .big{font-size:25px}.sl{grid-template-columns:110px 1fr 60px}}
</style>
</head>
<body>
<nav class="apptabs" aria-label="Command centre sections"><a href="https://bhanzudashboard.github.io/businesscommandcenter/" target="_top">Business Command Centre</a><a href="https://bhanzudashboard.github.io/businesscommandcenter/kra.html" target="_top">Daily KRA</a><a href="https://bhanzudashboard.github.io/businesscommandcenter/team.html" target="_top">Team</a><a href="https://bhanzudashboard.github.io/businesscommandcenter/predict.html" target="_top" class="on" aria-current="page">Predictive</a></nav>
<div class="wrap" id="app"><p class="note" style="padding:40px 0;text-align:center">Loading…</p></div>
<div class="tip" id="tip"></div>
<script>
/* ═══════════════════════════════════════════════════════════════════
   PREDICTIVE OUTLOOK — reads the daily forecast built by predictBuild()
   in the Daily KRA script. Sign-in is the same as the Team portal.
   ═══════════════════════════════════════════════════════════════════ */
const LIVE = { ENDPOINT: '', CLIENT_ID: '' };   // blank = borrowed from kra.html on the same site
if (!LIVE.ENDPOINT && /^https?:$/.test(location.protocol)) {
  try { const x = new XMLHttpRequest(); x.open('GET', 'kra.html?k=' + Date.now(), false); x.send();
    if (x.status === 200) { const ep = /ENDPOINT:\s*'([^']+)'/.exec(x.responseText), ci = /CLIENT_ID:\s*'([^']+)'/.exec(x.responseText);
      if (ep && /\/exec\s*$/.test(ep[1])) LIVE.ENDPOINT = ep[1].trim(); if (ci) LIVE.CLIENT_ID = ci[1].trim(); } } catch (e) { }
}
const $ = id => document.getElementById(id);
const store = { get: k => { try { return JSON.parse(localStorage.getItem(k)); } catch (e) { return null; } }, set: (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) { } }, del: k => { try { localStorage.removeItem(k); } catch (e) { } } };
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
let SESSION = store.get('team.session'), D = null, NOTES = null, ME = null;
const S = { mk: 'rp', leadMkt: 'all', bm: 'floor', metric: 'rp', leadTl: 'all', leadTeam: 'all', leadMin: 0, leadSort: 'pm', leadN: 40, tlSort: 'gap', dem: 0, dc: 0, open: {} };

async function api(action, payload = {}) {
  try { const r = await fetch(LIVE.ENDPOINT, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify({ action, session: SESSION, ...payload }) });
    return await r.json(); } catch (e) { return { ok: false, message: 'Couldn’t reach the server. Check your connection and try again.' }; }
}
async function boot() {
  if (window.__PRED) { D = window.__PRED.data; NOTES = window.__PRED.notes; ME = window.__PRED.me; return start(); }   // local preview
  if (!LIVE.ENDPOINT) return gate('This page needs the web app link. Open it from the Business Command Centre site.');
  if (!SESSION) return gate();
  const r = await api('team.predict');
  if (r.auth === false) { store.del('team.session'); SESSION = null; return gate(); }
  if (!r.ok) return gate(r.message);
  D = r.data; NOTES = r.notes; ME = r.me; start();
}
function gate(msg) {
  $('app').innerHTML = `<div class="gate"><h1>Predictive outlook</h1><p>${esc(msg || 'Sign in with your expinfi.com account. This page is for the Super admin and BMs.')}</p><div id="gbtn"></div></div>`;
  if (!LIVE.CLIENT_ID) return;
  const go = () => { google.accounts.id.initialize({ client_id: LIVE.CLIENT_ID, hd: 'expinfi.com', auto_select: true, callback: async c => {
      $('gbtn').innerHTML = '<p class="note">Signing you in…</p>'; const r = await api('team.predictLogin', { idToken: c.credential });
      if (!r.ok) return gate(r.message); SESSION = r.session; store.set('team.session', SESSION); D = r.data; NOTES = r.notes; ME = r.me; start(); } });
    google.accounts.id.renderButton($('gbtn'), { theme: 'filled_blue', size: 'large', shape: 'pill' }); };
  if (window.google && google.accounts) go(); else { const s = document.createElement('script'); s.src = 'https://accounts.google.com/gsi/client'; s.async = true; s.onload = go; document.head.appendChild(s); }
}

/* ── formatting ── */
const u0 = x => Math.round(Number(x) || 0).toLocaleString('en-IN');
const L = x => { x = Number(x) || 0; return x >= 1e7 ? '₹' + (x / 1e7).toFixed(2) + ' Cr' : '₹' + (x / 1e5).toFixed(1) + ' L'; };
const K = x => '₹' + Math.round((Number(x) || 0) / 1000).toLocaleString('en-IN') + 'k';
const pct = x => x == null ? '—' : Math.round(x * 100) + '%';
const fmt = (m, x) => m === 'otp' ? L(x) : m === 'dem' ? u0(x) : u0(x);
const unit = m => m === 'otp' ? '' : m === 'dem' ? ' demos' : ' RP units';
const day = k => new Date(k + 'T00:00:00Z').toLocaleDateString('en-GB', { weekday: 'short', day: 'numeric', month: 'short', timeZone: 'UTC' });
const mon = m => new Date(m + '-15T00:00:00Z').toLocaleDateString('en-GB', { month: 'short', year: '2-digit', timeZone: 'UTC' });
const nameOf = e => { const p = (D.people || []).find(x => x.e === e); return p ? p.n : e; };
const hitPill = p => p == null ? '<span class="pill x">no target</span>' : `<span class="pill ${p >= .6 ? 'g' : p >= .3 ? 'a' : 'r'}">${Math.round(p * 100)}%</span>`;

function start() {
  if (ME && ME.role === 'mgr' && S.bm === 'floor' && !S._init) { S.bm = ME.email; }
  S._init = true; render();
}
/* the slice the viewer has picked: the floor or one BM */
function scope() {
  if (S.bm === 'floor') return { name: 'The floor', rp: D.floor.rp, otp: D.floor.otp, tls: D.tls, sms: D.sms, leads: D.leads, warn: D.warnings };
  const b = D.bms.find(x => x.id === S.bm) || {}, tls = D.tls.filter(t => t.bm === S.bm), ids = tls.map(t => t.id);
  const mk = f => ({ mtd: b[f].mtd, fc: b[f].fc, lo: b[f].fc - (D.floor[f].fc - D.floor[f].lo) * (b[f].fc / Math.max(1, D.floor[f].fc)), hi: b[f].fc + (D.floor[f].hi - D.floor[f].fc) * (b[f].fc / Math.max(1, D.floor[f].fc)),
    target: b[f].target, needPerNight: b[f].needPerNight, perNightFc: b[f].perNight, pHit: b[f].pHit });
  return { name: b.n || 'BM', rp: mk('rp'), otp: mk('otp'), tls, sms: D.sms.filter(s => s.bm === S.bm), leads: D.leads.filter(l => l.bm === S.bm || ids.includes(l.tl)), warn: D.warnings.filter(w => !w.owner || w.owner === S.bm), b };
}

/* ── the page ── */
function render() {
  const sc = scope(), r = sc.rp, o = sc.otp, gapR = r.target ? r.fc - r.target : null;
  const head = r.target ? (gapR >= 0 ? `At this pace ${sc.name === 'The floor' ? 'the floor' : sc.name + '’s teams'} land${sc.name === 'The floor' ? 's' : ''} ${u0(r.fc)} RP units, ${u0(gapR)} above target`
    : `At this pace ${sc.name === 'The floor' ? 'the floor' : sc.name + '’s teams'} land${sc.name === 'The floor' ? 's' : ''} ${u0(r.fc)} RP units, ${u0(-gapR)} short of ${u0(r.target)}`) : `At this pace ${sc.name} lands ${u0(r.fc)} RP units this month`;
  const subH = `${D.nightsLeft} nights left in ${D.monthName}. Booked so far: ${u0(r.mtd)} RP and ${L(o.mtd)} OTP. ` + (r.target && r.needPerNight > r.perNightFc ? `Reaching target needs ${r.needPerNight.toFixed(1)} RP a night; the forecast rate is ${r.perNightFc.toFixed(1)}.` : r.target ? `The forecast rate of ${r.perNightFc.toFixed(1)} RP a night is enough for target.` : '');
  const bmChips = [['floor', 'Floor']].concat(D.bms.map(b => [b.id, b.n])).map(([v, l]) => `<button class="chip${S.bm === v ? ' on' : ''}" data-bm="${esc(v)}">${esc(l)}</button>`).join('');
  $('app').innerHTML = `
  <div class="top"><span class="brand">Predictive outlook</span><div class="chips">${bmChips}</div><span class="note">Forecast as of the night of ${day(D.asOf)} · updated daily at 7:30 PM</span></div>
  <h1>${esc(head)}</h1><p class="sub">${esc(subH)}</p>
  <div class="hero">${tile('RP units', 'rp', r)}${tile('OTP revenue', 'otp', o)}</div>
  ${aiBlock()}
  <section class="panel"><div class="ph"><div class="kick">Outlook by market</div><h2>${esc(mktTitle())}</h2><p class="sub">US and Canada, each split by Indian and Non-Indian families. Forecast month-end against last month in full; the tick on each bar is last month. Hot leads are open demos with a 15%+ chance this month (most open leads are under 5%).</p></div>
    <div class="pb"><div class="filters"><div class="seg">${[['rp', 'RP units'], ['otp', 'OTP ₹']].map(([m, l]) => `<button class="${S.mk === m ? 'on' : ''}" data-mk="${m}">${l}</button>`).join('')}</div></div><div id="mkts" style="display:grid;grid-template-columns:minmax(0,1fr);gap:20px"></div></div></section>
  <section class="panel"><div class="ph"><div class="kick">Funnel leakage by market</div><h2 id="fh"></h2><p class="sub">Lead → demo done → sale for each market, this month so far against last month. “Leaks most” compares each market with the floor. Whole floor; leads aren’t assigned to a BM until the demo.</p></div>
    <div class="pb"><div class="tw" id="funt"></div><div style="margin-top:16px"><div class="filters"><h3 style="margin-right:6px">Why leads never reached a demo</h3><select id="fmk" aria-label="Market"></select><span class="note">Leads from 3 to 40 days ago with no demo yet, by CRM stage</span></div><div id="lost"></div></div></div></section>
  <section class="panel"><div class="ph"><div class="kick">Lead source return</div><h2 id="sh"></h2><p class="sub">What a lead from each source (UTM) turns into: demos and sales per 100 leads and revenue per lead, this month against last. Ad spend isn’t recorded by source, so this is return per lead, not per rupee spent.</p></div>
    <div class="pb tw" id="srct"></div></section>
  <section class="panel"><div class="ph"><div class="kick">Problems before they happen</div><h2>${warnTitle(sc.warn)}</h2><p class="sub">Each check looks at a leading signal (leads, demos, DC2E, attendance, hot leads waiting). The suggested fix is a starting point for the TL or BM.</p></div>
    <div class="pb">${sc.warn.length ? `<div class="warns">${sc.warn.map(warnCard).join('')}</div>` : '<div class="empty">Nothing to flag for this view.</div>'}</div></section>
  <section class="panel"><div class="ph"><div class="kick">Unusual nights</div><h2 id="uh"></h2><p class="sub">Last night, and the last three nights together, against what is normal for those weekdays: for the floor, each market and each team lead. Flagged only when it is well outside the usual night-to-night swing.</p></div>
    <div class="pb" id="unl"></div></section>
  <section class="panel"><div class="ph"><div class="kick">The month, night by night</div><h2 id="nh"></h2><p class="sub">Solid bars are booked nights; light bars are the forecast for each night left, from the floor’s recent rate and its weekly rhythm.</p></div>
    <div class="pb"><div class="filters"><div class="seg">${[['rp', 'RP units'], ['otp', 'OTP ₹'], ['dem', 'Demos']].map(([m, l]) => `<button class="${S.metric === m ? 'on' : ''}" data-metric="${m}">${l}</button>`).join('')}</div><span class="note">Whole floor</span></div><div id="nchart"></div>
    <div class="legend"><span><i style="background:var(--accent)"></i>Booked</span><span><i style="background:var(--fc)"></i>Forecast</span><span><i style="background:var(--ink);width:12px;height:2px"></i>Nightly need for target</span></div></div></section>

      <td><div class="bar" title="Forecast ${fmt(m, x.fc)} of ${fmt(m, x.target)}"><div class="f" style="width:${x.fc / max * 100}%;background:${col}"></div>${x.target ? `<div class="t" style="left:${x.target / max * 100}%"></div>` : ''}</div></td>
      <td class="n">${x.needPerNight ? (m === 'otp' ? K(x.needPerNight) : x.needPerNight) : '—'}</td><td class="n">${m === 'otp' ? K(x.perNight) : x.perNight}</td><td class="n">${hitPill(x.pHit)}</td><td class="n">${t.dc2e != null ? t.dc2e + '%' : '—'}</td></tr>${sm}`; }).join('')}</table>`;
}
const leadTitle = Ls => { const hot = Ls.filter(l => l.pm >= .15), rp = hot.filter(l => l.team === 'RP').reduce((a, l) => a + l.pm, 0), otp = hot.filter(l => l.team === 'OTP').reduce((a, l) => a + l.ev, 0);
  return hot.length ? `${hot.length} hot leads could bring about ${u0(rp)} RP units and ${L(otp)} OTP this month` : 'No hot leads right now'; };
function leadFilters(sc) {
  const tls = sc.tls.map(t => `<option value="${esc(t.id)}"${S.leadTl === t.id ? ' selected' : ''}>${esc(t.n)}</option>`).join('');

    <select id="lteam" aria-label="Team"><option value="all">RP and OTP</option><option value="RP"${S.leadTeam === 'RP' ? ' selected' : ''}>RP</option><option value="OTP"${S.leadTeam === 'OTP' ? ' selected' : ''}>OTP</option></select>
    <select id="lmkt" aria-label="Market"><option value="all">All markets</option>${['US|Indian', 'US|Non-Indian', 'CA|Indian', 'CA|Non-Indian'].map(v => `<option value="${v}"${S.leadMkt === v ? ' selected' : ''}>${v.replace('|', ' · ')}</option>`).join('')}</select>
    <select id="lmin" aria-label="Minimum chance"><option value="0">Any chance</option>${[.05, .1, .15, .3].map(v => `<option value="${v}"${S.leadMin == v ? ' selected' : ''}>${v * 100}%+ this month</option>`).join('')}</select>
    <button class="btn" id="lcsv">Download list</button><span class="note" id="lcount"></span></div>`;

const mktOf = l => { const c = String(l.ctry || '').toUpperCase(); return (c === 'US' || c === 'CA' ? c : 'Other') + '|' + (l.eth === 'Indian' ? 'Indian' : l.eth === 'Unknown' ? 'Unknown' : 'Non-Indian'); };
function leadRows() { const sc = scope(); return sc.leads.filter(l => (S.leadMkt === 'all' || mktOf(l) === S.leadMkt) && (S.leadTl === 'all' || l.tl === S.leadTl) && (S.leadTeam === 'all' || l.team === S.leadTeam) && l.pm >= S.leadMin)
  .sort((a, b) => S.leadSort === 'age' ? a.age - b.age : S.leadSort === 'ev' ? (b.team === 'RP' ? b.pm * D.floor.ticket : b.ev) - (a.team === 'RP' ? a.pm * D.floor.ticket : a.ev) : b[S.leadSort] - a[S.leadSort]); }

      <td class="n">${Math.round(l.p7 * 100)}%</td><td class="n"><b>${Math.round(l.pm * 100)}%</b><div class="bar" style="min-width:60px;height:5px;margin-top:3px"><div class="f" style="width:${l.pm * 100}%;background:var(--accent)"></div></div></td>
      <td class="n">${l.team === 'RP' ? l.ev.toFixed(2) + ' RP' : K(l.ev)}</td><td><div class="why">${l.why.map(w => `<span>${esc(w)}</span>`).join('')}</div></td></tr>`).join('')}</table>
    ${L1.length > S.leadN ? `<p style="margin-top:10px"><button class="btn" id="lmore">Show ${Math.min(40, L1.length - S.leadN)} more</button></p>` : ''}` : '<div class="empty">No open leads match these filters.</div>';

function csv() {
  const rows = [['Lead ID', 'SM', 'TL', 'Team', 'Subject', 'Stage', 'Demo night', 'Nights since demo', 'Chance next 7 nights %', 'Chance by month end %', 'Worth', 'Why']].concat(leadRows().map(l => [l.id, l.sm, nameOf(l.tl), l.team, l.subj, l.st, l.k, l.age, Math.round(l.p7 * 100), Math.round(l.pm * 100), l.team === 'RP' ? l.ev : Math.round(l.ev), l.why.join('; ')]));

/* ── charts (plain SVG) ── */
function tipOn(el, html) { el.addEventListener('mousemove', e => { const t = $('tip'); t.innerHTML = html; t.style.display = 'block'; t.style.left = Math.min(innerWidth - 270, e.clientX + 12) + 'px'; t.style.top = (e.clientY + 12) + 'px'; }); el.addEventListener('mouseleave', () => $('tip').style.display = 'none'); }
function drawNights() {
  const m = S.metric, N = D.nights, val = n => n[m] != null ? n[m] : n['f' + m], box = $('nchart'), W = box.clientWidth || 900, Hh = 220, pl = 44, pb = 26, pt = 10, iw = W - pl - 8, ih = Hh - pb - pt;
  const f = D.floor[m], need = m !== 'dem' && f.target ? f.needPerNight : 0, max = Math.max(...N.map(val), need) * 1.12 || 1, bw = iw / N.length, y = v => pt + ih - v / max * ih;
  const ticks = [0, max / 2, max].map(v => `<line x1="${pl}" x2="${W - 8}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)"/><text x="${pl - 6}" y="${y(v) + 4}" text-anchor="end">${m === 'otp' ? K(v) : Math.round(v)}</text>`).join('');
  const bars = N.map((n, i) => { const v = val(n) || 0, x = pl + i * bw + 1, h = Math.max(0, pt + ih - y(v)), done = n[m] != null;
    return `<g class="nb" data-i="${i}"><rect x="${x}" y="${pt}" width="${Math.max(1, bw - 2)}" height="${ih}" fill="transparent"/><rect x="${x}" y="${y(v)}" width="${Math.max(1, bw - 2)}" height="${h}" rx="3" fill="${done ? 'var(--accent)' : 'var(--fc)'}"/></g>`; }).join('');
  const lab = N.map((n, i) => (i % Math.ceil(N.length / (W < 600 ? 6 : 12)) === 0) ? `<text x="${pl + i * bw + bw / 2}" y="${Hh - 8}" text-anchor="middle">${+n.k.slice(8)}</text>` : '').join('');
  const nl = need ? `<line x1="${pl + N.findIndex(n => n[m] == null) * bw}" x2="${W - 8}" y1="${y(need)}" y2="${y(need)}" stroke="var(--ink)" stroke-width="2" stroke-dasharray="5 4"/>` : '';
  box.innerHTML = `<svg width="${W}" height="${Hh}" role="img" aria-label="Nightly ${m} this month">${ticks}${bars}${nl}${lab}</svg>`;
  box.querySelectorAll('.nb').forEach(g => { const n = N[+g.dataset.i], v = val(n), done = n[m] != null; tipOn(g, `<b>${day(n.k)}</b>${n.hol ? ' · ' + esc(n.hol) : ''}<br>${done ? 'Booked' : 'Forecast'}: ${m === 'otp' ? L(v) : (Math.round(v * 10) / 10) + (m === 'dem' ? ' demos' : ' RP')}${done && m !== 'dem' ? `<br>Demos: ${n.dem}` : ''}`); });
  const left = N.filter(n => n[m] == null), restAvg = left.length ? left.reduce((a, n) => a + val(n), 0) / left.length : 0;
  $('nh').textContent = m === 'dem' ? `About ${Math.round(restAvg)} demos a night expected for the rest of the month` : need ? (restAvg >= need ? `The nights ahead cover what target needs (${m === 'otp' ? K(need) : need.toFixed(1)} a night)` : `The nights ahead fall short: ${m === 'otp' ? K(restAvg) : restAvg.toFixed(1)} expected a night against ${m === 'otp' ? K(need) : need.toFixed(1)} needed`) : `${m === 'otp' ? K(restAvg) : restAvg.toFixed(1)} expected a night for the rest of the month`;
}
function drawMonths() {
  const M = D.months.slice(-6), cur = D.month, box = $('mchart'), W = box.clientWidth || 520, Hh = 220, pl = 40, pb = 28, pt = 18, iw = W - pl - 8, ih = Hh - pb - pt;
  const rows = M.map(x => ({ m: x.m, v: x.m === cur ? D.floor.rp.fc : x.rp, cur: x.m === cur, lo: x.m === cur ? D.floor.rp.lo : null, hi: x.m === cur ? D.floor.rp.hi : null })).concat([{ m: D.next.m, v: D.next.rp, next: true, lo: D.next.rpLo, hi: D.next.rpHi }]);

    return `<g class="mb" data-i="${i}"><rect x="${x}" y="${y(r.v)}" width="${w}" height="${pt + ih - y(r.v)}" rx="4" fill="${fill}"/>${r.lo != null ? `<line x1="${x + w / 2}" x2="${x + w / 2}" y1="${y(r.hi)}" y2="${y(r.lo)}" stroke="var(--ink)" stroke-width="1.5"/>` : ''}
      <text x="${x + w / 2}" y="${y(r.hi || r.v) - 5}" text-anchor="middle" style="fill:var(--ink);font-weight:600">${u0(r.v)}</text><text x="${x + w / 2}" y="${Hh - 9}" text-anchor="middle">${mon(r.m)}${r.cur ? ' (fc)' : r.next ? ' (proj)' : ''}</text></g>`; }).join('');

  $('mnext').innerHTML = `<h3>What the projection assumes</h3><table class="tbl" style="margin-top:6px"><tr><td>New leads a day (last 14 days)</td><td class="n"><b>${n.leadsPerDay}</b></td></tr><tr><td>Leads in ${mon(n.m)}</td><td class="n">${u0(n.leads)}</td></tr><tr><td>Lead → demo</td><td class="n">${n.l2d}%</td></tr><tr><td>Demos</td><td class="n">${u0(n.dem)}</td></tr><tr><td>RP units</td><td class="n"><b>${u0(n.rp)}</b> <span class="note">(${u0(n.rpLo)}–${u0(n.rpHi)})</span></td></tr><tr><td>OTP revenue</td><td class="n"><b>${L(n.otp)}</b> <span class="note">(${L(n.otpLo)}–${L(n.otpHi)})</span></td></tr></table>
    <p class="note" style="margin-top:8px">The range uses the lowest and highest value per demo of the last three months. If lead flow changes, this moves with it.</p>`;

function drawWhat() {
  const sc = scope(), f = sc.rp, o = sc.otp, dem = +$('sdem').value, dc = +$('sdc').value, base = D.floor.dc2e.mtd || 30;
  S.dem = dem; S.dc = dc; $('odem').textContent = (dem > 0 ? '+' : '') + dem + '%'; $('odc').textContent = (dc > 0 ? '+' : '') + dc + ' pts';
  const mult = (1 + dem / 100) * ((base + dc) / base), rp = f.mtd + (f.fc - f.mtd) * mult, ot = o.mtd + (o.fc - o.mtd) * mult;
  const line = (lab, m, v, x) => `<div style="margin-bottom:12px"><div class="note">${lab}</div><div class="res">${fmt(m, v)}</div>${x.target ? `<div class="${v >= x.target ? 'pos' : 'neg'}">${v >= x.target ? 'Reaches target with ' + fmt(m, v - x.target) + ' to spare' : fmt(m, x.target - v) + ' short of target'}</div>` : ''}</div>`;
  $('what').innerHTML = line('RP units at month end', 'rp', rp, f) + line('OTP revenue at month end', 'otp', ot, o) + `<p class="note">Floor DC2E so far this month: ${base}%. Changes apply only to the nights left.</p>`;
}
function drawLifts() {
  const dims = ['source', 'eth', 'grade', 'country', 'lead', 'booked'].filter(k => D.lifts[k] && D.lifts[k].rows.length >= 2), box = $('lifts');
  let all = []; dims.forEach(k => D.lifts[k].rows.forEach(r => all.push(Object.assign({ dim: D.lifts[k].label }, r))));
  const top = all.slice().sort((a, b) => b.lift - a.lift)[0], bot = all.slice().sort((a, b) => a.lift - b.lift)[0];
  $('dh').textContent = top && bot ? `${top.dim} “${top.v}” converts ${top.lift.toFixed(1)}× the floor; ${bot.dim.toLowerCase()} “${bot.v}” only ${bot.lift.toFixed(1)}×` : 'What drives a sale';
  box.innerHTML = dims.map(k => { const R = D.lifts[k].rows.slice(0, 6), mx = Math.max(2, ...R.map(r => r.lift));
    return `<h3 style="margin-top:10px">${esc(D.lifts[k].label)}</h3>` + R.map(r => `<div style="display:grid;grid-template-columns:130px 1fr 92px;gap:8px;align-items:center;margin:4px 0;font-size:12px"><span style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap" title="${esc(r.v)}">${esc(r.v)}</span>
      <div class="bar" style="min-width:60px"><div class="f" style="width:${r.lift / mx * 100}%;background:${r.lift >= 1.15 ? 'var(--accent)' : r.lift <= .85 ? 'var(--neg)' : 'var(--ctx)'}"></div><div class="t" style="left:${1 / mx * 100}%;width:1px"></div></div>
      <span class="mono" style="text-align:right">${r.lift.toFixed(2)}× <span class="note">${r.rate}%</span></span></div>`).join(''); }).join('') + '<p class="note" style="margin-top:8px">The thin line is the floor average (1×). Only values with 30+ demos are shown.</p>';
}
function drawLag() {
  const Lg = D.lag.filter(x => x.t <= 21), box = $('lagc'), W = box.clientWidth || 480, Hh = 150, pl = 34, pb = 22, pt = 8, iw = W - pl - 8, ih = Hh - pb - pt, max = Math.max(...Lg.map(x => x.h)) * 1.15 || 1;
  const x = t => pl + t / 21 * iw, y = v => pt + ih - v / max * ih, path = Lg.map((p, i) => (i ? 'L' : 'M') + x(p.t) + ' ' + y(p.h)).join(' ');
  box.innerHTML = `<svg width="${W}" height="${Hh}" role="img" aria-label="Chance of buying by nights since demo"><line x1="${pl}" x2="${W - 8}" y1="${y(0)}" y2="${y(0)}" stroke="var(--line2)"/><text x="${pl - 5}" y="${y(max / 1.15) + 4}" text-anchor="end">${(max / 1.15).toFixed(1)}%</text>
    <path d="${path}" fill="none" stroke="var(--accent)" stroke-width="2"/>${Lg.map(p => `<circle class="lg" data-t="${p.t}" cx="${x(p.t)}" cy="${y(p.h)}" r="4" fill="var(--accent)" stroke="var(--surface)" stroke-width="2"/>`).join('')}
    ${[0, 7, 14, 21].map(t => `<text x="${x(t)}" y="${Hh - 6}" text-anchor="${t === 0 ? 'start' : t === 21 ? 'end' : 'middle'}">${t === 0 ? 'demo night' : t + ' nights'}</text>`).join('')}</svg>`;
  box.querySelectorAll('.lg').forEach(c => { const p = D.lag.find(z => z.t === +c.dataset.t); tipOn(c, `Night ${p.t} after the demo<br>${p.h}% of open leads bought<br><span style="opacity:.7">${p.risk} leads still open</span>`); });

function drawCalib() {
  $('calt').innerHTML = D.calib.length ? `<table class="tbl"><tr><th>Score said</th><th class="n">Leads</th><th class="n">Average score</th><th class="n">Actually bought</th></tr>${D.calib.map(c => `<tr><td>${c.band}</td><td class="n">${u0(c.n)}</td><td class="n">${c.said}%</td><td class="n"><b>${c.did}%</b></td></tr>`).join('')}</table>` : '<div class="empty">Not enough history yet.</div>';
}
function methodText() {
  const bt = D.floor.rp.backtest || [];
  return `<p><b>Month-end forecast.</b> Booked so far, plus each night left × the floor’s nightly rate (the last 28 nights, recent nights counting more) × that weekday’s usual share (Sun ${D.floor.dow[0]}×, Mon ${D.floor.dow[1]}×, … Sat ${D.floor.dow[6]}×). Holidays count at 60%. The same method was run at day ${D.dayNow} of each past month: actual ÷ forecast was ${bt.map(x => mon(x.m) + ' ' + x.r).join(', ') || 'not available'}. The median of those (${D.floor.rp.bias}) corrects the forecast, and their spread gives the likely range.</p>
  <p><b>Teams and people.</b> Each BM, TL and SM is forecast the same way from their own recent nights (blended with their month so far). The chance of reaching target treats the sales still to come as random around the forecast (Poisson), so a small gap with many nights left is still likely, and a big gap late in the month is not.</p>
  <p><b>Chance a lead buys.</b> Starts from how often leads still open on that night after their demo have bought (the fading curve), then is raised or lowered by what is known about the lead: ethnicity, source, grade, country, subject, new or older lead, how the demo was booked, and the SM’s own 30-day conversion. These overlap, so their combined effect is damped (power ${D.alpha}, chosen to best match past outcomes). The CRM stage then applies a starting weight (Payment link sent ×${D.stageW['Payment Link Sent']}, AD Positive ×${D.stageW['AD Positive']}, May buy later ×${D.stageW['AD May Buy Later']} …). Stage history is not kept in the CRM, so these weights are set by hand for now; each night’s scores are saved so they can be checked against what actually sold.</p>
  <p><b>Next month.</b> Leads a day over the last 14 days × days in the month × lead-to-demo rate × RP units and OTP ₹ per demo (median of the last three full months; the range uses their lowest and highest).</p>
  <p><b>Limits.</b> Forecasts assume the next nights look like the recent ones: a sudden change in lead flow, pricing or headcount will not show until it appears in the data. Lead IDs only; no names or contact details are shown.</p>`;
}
function bind() {

  document.querySelectorAll('[data-mk]').forEach(b => b.onclick = () => { S.mk = b.dataset.mk; document.querySelectorAll('[data-mk]').forEach(x => x.classList.toggle('on', x === b)); drawMkts(); });
  document.querySelectorAll('[data-metric]').forEach(b => b.onclick = () => { S.metric = b.dataset.metric; document.querySelectorAll('[data-metric]').forEach(x => x.classList.toggle('on', x === b)); drawNights(); });
  document.querySelectorAll('[data-tl]').forEach(r => r.onclick = () => { S.open[r.dataset.tl] = !S.open[r.dataset.tl]; render(); });
  $('ltl').onchange = e => { S.leadTl = e.target.value; S.leadN = 40; drawLeads(); };
  $('lteam').onchange = e => { S.leadTeam = e.target.value; S.leadN = 40; drawLeads(); };
  $('lmkt').onchange = e => { S.leadMkt = e.target.value; S.leadN = 40; drawLeads(); };
  $('lmin').onchange = e => { S.leadMin = +e.target.value; S.leadN = 40; drawLeads(); };
  $('lcsv').onclick = csv; $('sdem').oninput = drawWhat; $('sdc').oninput = drawWhat;
}
let _rz; addEventListener('resize', () => { clearTimeout(_rz); _rz = setTimeout(() => { if (D) { drawMkts(); drawCap(); drawNights(); drawMonths(); drawLag(); } }, 200); });
boot();
