<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Daily KRA — Business Command Centre</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#f4f7fa;--surface:#ffffff;--raised:#fbfcfe;--line:#dce5ed;--line2:#c6d4e0;
  --ink:#0e1d2a;--mute:#57708a;--dim:#8fa4b8;
  --accent:#1668b3;--accent-soft:#e8f1fa;--accent-line:#a8cbe9;
  --pos:#0d7550;--pos-bg:#e4f3ec;--warn:#a4640f;--warn-bg:#fbeed8;--neg:#b8382a;--neg-bg:#fbe6e2;
  --off:#4f5f78;--off-bg:#e9eef4;--leave:#6f4e9c;--leave-bg:#f0eaf8;
  --strip:#0e1d2a;--strip-ink:#b9c8d6;--strip-on:#f4f7fa;
  --shadow:0 1px 2px rgba(14,29,42,.05),0 8px 24px -16px rgba(14,29,42,.18);
  --mono:'IBM Plex Mono',ui-monospace,SFMono-Regular,Menlo,monospace;
  --display:'Bricolage Grotesque','Inter',system-ui,sans-serif;
  --body:'Inter',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  color-scheme:light;
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --paper:#0b131b;--surface:#111b25;--raised:#15212d;--line:#223241;--line2:#2e4254;
  --ink:#e4edf5;--mute:#93a8bb;--dim:#62788c;
  --accent:#62a8e8;--accent-soft:#122a40;--accent-line:#285680;
  --pos:#4cc395;--pos-bg:#0e2a20;--warn:#e2a654;--warn-bg:#2d2313;--neg:#ee7e70;--neg-bg:#341b18;
  --off:#a9b8ca;--off-bg:#1a2633;--leave:#bc9fe2;--leave-bg:#261e35;
  --strip:#050a0f;--strip-ink:#8ea2b5;--strip-on:#0b131b;color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#0b131b;--surface:#111b25;--raised:#15212d;--line:#223241;--line2:#2e4254;
  --ink:#e4edf5;--mute:#93a8bb;--dim:#62788c;
  --accent:#62a8e8;--accent-soft:#122a40;--accent-line:#285680;
  --pos:#4cc395;--pos-bg:#0e2a20;--warn:#e2a654;--warn-bg:#2d2313;--neg:#ee7e70;--neg-bg:#341b18;
  --off:#a9b8ca;--off-bg:#1a2633;--leave:#bc9fe2;--leave-bg:#261e35;
  --strip:#050a0f;--strip-ink:#8ea2b5;--strip-on:#0b131b;color-scheme:dark}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-padding-top:env(safe-area-inset-top,0px);-webkit-text-size-adjust:100%}
body{background:var(--paper);color:var(--ink);font-family:var(--body);font-size:13.5px;line-height:1.5;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:4px}
img,svg{max-width:100%}
.mono{font-family:var(--mono)}

/* ── app tabs: the same strip sits on top of the command centre ── */
.apptabs{background:var(--strip);display:flex;align-items:flex-end;gap:2px;padding:8px 22px 0;overflow-x:auto}
.apptabs a{color:var(--strip-ink);text-decoration:none;font-size:12.5px;font-weight:500;padding:8px 16px 9px;border-radius:8px 8px 0 0;white-space:nowrap;display:flex;align-items:center;gap:8px}
.apptabs a:hover{color:#fff;background:rgba(255,255,255,.06)}
.apptabs a.on{background:var(--surface);color:var(--ink);font-weight:600}
.apptabs .pend{font-family:var(--mono);font-size:10.5px;background:var(--neg);color:#fff;border-radius:9px;padding:0 6px;line-height:17px}

/* ── masthead ── */
header{background:var(--surface);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:40}
.mast{display:flex;align-items:center;gap:18px;padding:14px 26px 12px;flex-wrap:wrap}
.kick{font-size:11px;color:var(--mute);margin-bottom:2px}
h1{font-family:var(--display);font-size:23px;font-weight:700;letter-spacing:-.022em;line-height:1.1}
.who{margin-left:auto;display:flex;align-items:center;gap:10px}
.av{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font-family:var(--display);font-weight:700;font-size:13px;background:var(--accent-soft);color:var(--accent);border:1px solid var(--accent-line);flex:none}
.who-t{line-height:1.25;text-align:right}
.who-t b{display:block;font-weight:600}
.who-t span{font-size:11.5px;color:var(--mute)}
.viewbar{display:flex;align-items:center;gap:12px;padding:0 26px;border-top:1px solid var(--line);flex-wrap:wrap}
.vtabs{display:flex;gap:4px;overflow-x:auto}
.vtab{background:none;border:0;padding:11px 12px 10px;font-weight:500;color:var(--mute);border-bottom:2px solid transparent;white-space:nowrap}
.vtab:hover{color:var(--ink)}
.vtab.on{color:var(--ink);border-bottom-color:var(--accent);font-weight:600}
.proto{margin-left:auto;display:flex;align-items:center;gap:8px;font-size:11.5px;color:var(--warn);padding:6px 0}
.proto select{border:1px solid var(--warn);background:var(--warn-bg);color:var(--ink);border-radius:6px;padding:4px 8px;font-size:12px}

main{max-width:1240px;margin:0 auto;padding:22px 26px 60px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow)}
.ph{display:flex;align-items:baseline;gap:10px;padding:16px 20px 0;flex-wrap:wrap}
.ph h2{font-family:var(--display);font-size:17px;font-weight:700;letter-spacing:-.01em}
.ph p{color:var(--mute);font-size:12.5px}
.ph .r{margin-left:auto}
.pb{padding:14px 20px 20px}
.note{color:var(--mute);font-size:12.5px}
.btn{border:1px solid var(--line2);background:var(--surface);border-radius:8px;padding:8px 14px;font-weight:500;font-size:13px;transition:background .15s,border-color .15s}
.btn:hover{border-color:var(--accent-line);background:var(--accent-soft)}
.btn-p{background:var(--accent);border-color:var(--accent);color:#fff}
.btn-p:hover{background:#0f5596;border-color:#0f5596}
.btn-go{background:var(--pos);border-color:var(--pos);color:#fff;font-weight:600;padding:11px 20px;font-size:14px}
.btn-go:hover{filter:brightness(1.08);background:var(--pos)}
.btn-s{padding:5px 10px;font-size:12px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.link{background:none;border:0;color:var(--accent);font-weight:500;padding:0}
.link:hover{text-decoration:underline}

/* ── status chips ── */
.st{display:inline-flex;align-items:center;gap:6px;font-size:11.5px;font-weight:600;padding:2px 9px;border-radius:20px;white-space:nowrap}
.st::before{content:'';width:6px;height:6px;border-radius:50%;background:currentColor}
.st-present{background:var(--pos-bg);color:var(--pos)}
.st-lop{background:var(--neg-bg);color:var(--neg)}
.st-weekoff{background:var(--off-bg);color:var(--off)}
.st-leave{background:var(--leave-bg);color:var(--leave)}
.st-pending{background:var(--warn-bg);color:var(--warn)}
.st-progress{background:var(--accent-soft);color:var(--accent)}
.st-future,.st-none{background:var(--paper);color:var(--dim)}

/* ── my day hero: the shift clock ── */
.hero{display:grid;grid-template-columns:auto 1fr;gap:28px;align-items:center;padding:22px 26px;margin-bottom:18px}
.clock{width:188px;height:188px;position:relative;flex:none}
.clock svg{width:100%;height:100%;transform:rotate(-90deg);overflow:visible}
.clock .trk{fill:none;stroke:var(--line);stroke-width:5}
.clock .time{fill:none;stroke:var(--warn);stroke-width:5;stroke-linecap:round;transition:stroke-dashoffset 1s linear}
.clock .seg{fill:none;stroke:var(--line);stroke-width:13;stroke-linecap:butt;transition:stroke .5s}
.clock .seg.done{stroke:var(--accent)}
.clock .seg.cur{stroke:var(--accent-line)}
.clock.allgood .seg{stroke:var(--pos)}
.clock-c{position:absolute;inset:0;display:grid;place-content:center;text-align:center}
.clock-c b{font-family:var(--display);font-size:38px;font-weight:700;letter-spacing:-.03em;line-height:1}
.clock-c span{font-size:11.5px;color:var(--mute);margin-top:4px}
.hero h2{font-family:var(--display);font-size:30px;font-weight:700;letter-spacing:-.025em;line-height:1.1}
.hero .sub{color:var(--mute);margin-top:6px;max-width:58ch}
.cd{display:flex;align-items:baseline;gap:10px;margin-top:14px;flex-wrap:wrap}
.cd b{font-family:var(--mono);font-size:26px;font-weight:600;letter-spacing:-.02em}
.cd span{color:var(--mute);font-size:12.5px}
.cd.hot b{color:var(--neg)}
.facts{display:flex;gap:26px;margin-top:16px;flex-wrap:wrap}
.fact b{font-family:var(--mono);font-size:18px;font-weight:600;display:block;line-height:1.2}
.fact span{font-size:11.5px;color:var(--mute)}
.week{display:flex;gap:6px;margin-top:16px;flex-wrap:wrap}
.wd{width:38px;text-align:center;font-size:10.5px;color:var(--mute)}
.wd i{display:block;height:8px;border-radius:4px;margin-top:4px;background:var(--line)}
.wd.present i{background:var(--pos)}.wd.lop i{background:var(--neg)}.wd.weekoff i{background:var(--off)}.wd.leave i{background:var(--leave)}.wd.progress i,.wd.pending i{background:var(--warn)}

/* ── the form flow ── */
.flow{display:grid;grid-template-columns:232px 1fr;gap:18px;align-items:start}
.rail{padding:10px;position:sticky;top:140px}
.rstep{display:flex;align-items:center;gap:11px;width:100%;background:none;border:0;padding:9px 10px;border-radius:8px;text-align:left;color:var(--mute)}
.rstep:hover{background:var(--paper)}
.rstep.on{background:var(--accent-soft);color:var(--ink);font-weight:600}
.rn{width:24px;height:24px;border-radius:50%;border:1.5px solid var(--line2);display:grid;place-items:center;font-family:var(--mono);font-size:11px;flex:none;transition:all .3s}
.rstep.ok .rn{background:var(--accent);border-color:var(--accent);color:#fff}
.rstep.bad .rn{border-color:var(--neg);color:var(--neg)}
.rl{line-height:1.25}
.rl small{display:block;font-size:11px;color:var(--dim);font-weight:400}
.stage{overflow:hidden}
.stage-in{padding:22px 24px 8px}
.stage-in.enter{animation:slideIn .38s cubic-bezier(.2,.8,.2,1)}
.stage-in.enter.back{animation-name:slideBack}
@keyframes slideIn{from{opacity:0;transform:translateX(26px)}to{opacity:1;transform:none}}
@keyframes slideBack{from{opacity:0;transform:translateX(-26px)}to{opacity:1;transform:none}}
.stage h3{font-family:var(--display);font-size:20px;font-weight:700;letter-spacing:-.015em}
.stage .why{color:var(--mute);font-size:12.5px;margin-top:3px;max-width:70ch}
.blk{margin-top:20px;padding-top:18px;border-top:1px dashed var(--line)}
.blk:first-of-type{border-top:0;padding-top:0}
.blk h4{font-size:13.5px;font-weight:600;margin-bottom:12px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.blk h4 small{font-weight:400;color:var(--mute);font-size:12px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:14px 18px}
.grid.w2{grid-template-columns:repeat(auto-fill,minmax(280px,1fr))}
.f{display:flex;flex-direction:column;gap:6px;min-width:0}
.f>label,.f>.lab{font-size:12px;font-weight:500;color:var(--mute)}
.f.err>label,.f.err>.lab{color:var(--neg)}
.f.err .inp,.f.err .stp{border-color:var(--neg)}
.inp{border:1px solid var(--line2);background:var(--raised);border-radius:8px;padding:9px 11px;width:100%;transition:border-color .15s,box-shadow .15s}
.inp:focus{outline:0;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
textarea.inp{min-height:62px;resize:vertical}
.money{position:relative}
.money .inp{padding-left:26px;font-family:var(--mono)}
.money::before{content:'₹';position:absolute;left:11px;top:50%;transform:translateY(-50%);color:var(--dim)}
.stp{display:flex;align-items:center;border:1px solid var(--line2);border-radius:8px;background:var(--raised);width:max-content}
.stp button{width:36px;height:38px;border:0;background:none;font-size:18px;color:var(--accent);border-radius:8px}
.stp button:hover{background:var(--accent-soft)}
.stp input{width:52px;text-align:center;border:0;background:none;font-family:var(--mono);font-size:15px;font-weight:600;padding:8px 0;-moz-appearance:textfield}
.stp input::-webkit-outer-spin-button,.stp input::-webkit-inner-spin-button{-webkit-appearance:none}
.stp input:focus{outline:0}
.pips{display:flex;gap:4px;margin-top:2px}
.pips i{width:16px;height:5px;border-radius:3px;background:var(--line);transition:background .3s}
.pips i.on{background:var(--pos)}
.yn{display:inline-flex;border:1px solid var(--line2);border-radius:8px;overflow:hidden;width:max-content}
.yn button{border:0;background:var(--raised);padding:8px 16px;font-weight:500;color:var(--mute)}
.yn button+button{border-left:1px solid var(--line2)}
.yn button.on[data-v="yes"]{background:var(--pos);color:#fff}
.yn button.on[data-v="no"]{background:var(--neg);color:#fff}
.yn button.on:not([data-v="yes"]):not([data-v="no"]){background:var(--accent);color:#fff}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1px solid var(--line2);background:var(--raised);border-radius:20px;padding:6px 13px;font-size:12.5px;display:inline-flex;align-items:center;gap:7px;transition:all .18s}
.chip::before{content:'';width:14px;height:14px;border-radius:50%;border:1.5px solid var(--line2);transition:all .18s}
.chip.on{border-color:var(--pos);background:var(--pos-bg);color:var(--ink)}
.chip.on::before{background:var(--pos);border-color:var(--pos);box-shadow:inset 0 0 0 3px var(--pos-bg)}
.chip:active{transform:scale(.96)}
.live{display:flex;gap:14px;margin-top:16px;flex-wrap:wrap}
.meter{flex:1;min-width:220px;background:var(--paper);border-radius:10px;padding:12px 14px}
.meter .top{display:flex;justify-content:space-between;align-items:baseline;font-size:12px;color:var(--mute)}
.meter .top b{font-family:var(--mono);font-size:18px;color:var(--ink)}
.bar{height:8px;background:var(--line);border-radius:5px;margin-top:8px;position:relative;overflow:visible}
.bar i{display:block;height:100%;border-radius:5px;background:var(--accent);width:0;transition:width .6s cubic-bezier(.2,.8,.2,1),background .3s}
.bar i.good{background:var(--pos)}.bar i.bad{background:var(--neg)}.bar i.mid{background:var(--warn)}
.bar .mark{position:absolute;top:-4px;bottom:-4px;width:2px;background:var(--ink);opacity:.5}
.meter .msg{font-size:11.5px;margin-top:6px;color:var(--mute)}
.case{border:1px solid var(--line);border-radius:10px;padding:14px;margin-top:10px;background:var(--raised)}
.case.new{animation:pop .3s ease}
@keyframes pop{from{opacity:0;transform:scale(.97)}to{opacity:1;transform:none}}
.case-h{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;font-weight:600;font-size:12.5px}
.warnline{font-size:12px;color:var(--warn);background:var(--warn-bg);padding:6px 10px;border-radius:6px;margin-top:8px}
.foot{display:flex;align-items:center;gap:10px;padding:16px 24px;border-top:1px solid var(--line);margin-top:22px;background:var(--raised);flex-wrap:wrap}
.foot .sp{flex:1}
.foot .saved{font-size:12px;color:var(--dim)}
.errs{font-size:12.5px;color:var(--neg)}

/* ── done / closed states ── */
.done{padding:34px 28px;display:grid;grid-template-columns:auto 1fr;gap:30px;align-items:center}
.stamp{width:150px;height:150px;border-radius:50%;border:4px double var(--pos);color:var(--pos);display:grid;place-content:center;text-align:center;transform:rotate(-9deg);flex:none}
.stamp b{font-family:var(--display);font-size:28px;font-weight:700;letter-spacing:.01em;line-height:1}
.stamp span{font-family:var(--mono);font-size:11px;margin-top:5px}
.stamp.anim{animation:stamp .55s cubic-bezier(.2,1.6,.4,1)}
@keyframes stamp{0%{opacity:0;transform:rotate(-9deg) scale(2.2)}60%{opacity:1}100%{transform:rotate(-9deg) scale(1)}}
.stamp.lop{border-color:var(--neg);color:var(--neg)}
.stamp.weekoff{border-color:var(--off);color:var(--off)}
.stamp.leave{border-color:var(--leave);color:var(--leave)}
.done h3{font-family:var(--display);font-size:24px;font-weight:700;letter-spacing:-.02em}
.done p{color:var(--mute);margin-top:6px;max-width:62ch}
.done .acts{display:flex;gap:10px;margin-top:16px;flex-wrap:wrap}
.sumgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;margin-top:18px}
.sum{background:var(--paper);border-radius:8px;padding:10px 12px}
.sum b{font-family:var(--mono);font-size:16px;display:block}
.sum span{font-size:11.5px;color:var(--mute)}

/* ── kpis & tables ── */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin-bottom:18px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 16px;box-shadow:var(--shadow)}
.kpi>span{font-size:12px;color:var(--mute)}
.kpi b{display:block;font-family:var(--mono);font-size:24px;font-weight:600;letter-spacing:-.02em;margin-top:2px}
.kpi>small{font-size:11.5px;color:var(--dim)}
.kpi.neg b{color:var(--neg)}.kpi.pos b{color:var(--pos)}
.tw{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:12.5px}
th{text-align:left;font-weight:500;color:var(--mute);font-size:11.5px;padding:9px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:10px;border-bottom:1px solid var(--line);white-space:nowrap}
td.n,th.n{text-align:right;font-family:var(--mono)}
tr.click{cursor:pointer}
tr.click:hover td{background:var(--paper)}
.good{color:var(--pos)}.bad{color:var(--neg)}.mid{color:var(--warn)}
.tl-n{display:flex;align-items:center;gap:9px;font-weight:500}
.tl-n .av{width:26px;height:26px;font-size:10.5px}

/* ── calendar ── */
.calwrap{display:grid;grid-template-columns:1fr 300px;gap:18px;align-items:start}
.calhead{display:flex;align-items:center;gap:10px;padding:16px 20px 6px}
.calhead h2{font-family:var(--display);font-size:20px;font-weight:700;letter-spacing:-.015em;min-width:160px}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;padding:10px 20px 20px}
.cal .dh{font-size:11px;color:var(--mute);text-align:center;padding-bottom:4px}
.cd2{aspect-ratio:1/0.72;border-radius:9px;border:1px solid var(--line);background:var(--raised);padding:6px 7px;text-align:left;display:flex;flex-direction:column;justify-content:space-between;position:relative;min-height:54px;transition:transform .15s,box-shadow .15s}
.cd2 .dn{font-family:var(--mono);font-size:12px;font-weight:600}
.cd2 .dl{font-size:10px;font-weight:600;line-height:1.15}
.cd2.present{background:var(--pos-bg);border-color:transparent;color:var(--pos)}
.cd2.lop{background:var(--neg-bg);border-color:transparent;color:var(--neg)}
.cd2.weekoff{background:var(--off-bg);border-color:transparent;color:var(--off)}
.cd2.leave{background:var(--leave-bg);border-color:transparent;color:var(--leave)}
.cd2.pending,.cd2.progress{background:var(--warn-bg);border-color:var(--warn);color:var(--warn)}
.cd2.future{color:var(--mute)}
.cd2.none,.cd2.blank{background:transparent;border-color:transparent;color:var(--dim)}
.cd2.can{cursor:pointer}
.cd2.can:hover{transform:translateY(-2px);box-shadow:var(--shadow)}
.cd2.lock{opacity:.55}
.cd2.sel{outline:2px solid var(--accent);outline-offset:1px;transform:translateY(-2px)}
.cd2 .rv{position:absolute;top:5px;right:6px;font-size:9px;font-weight:700;color:var(--neg)}
.legend{display:flex;gap:12px;flex-wrap:wrap;padding:0 20px 16px;font-size:11.5px;color:var(--mute)}
.legend span{display:inline-flex;align-items:center;gap:5px}
.legend i{width:10px;height:10px;border-radius:3px;display:inline-block}
.side .pb>*+*{margin-top:12px}
.side .sumgrid{grid-template-columns:1fr 1fr}
.rule{font-size:12px;color:var(--mute);padding-left:14px;position:relative}
.rule::before{content:'';position:absolute;left:2px;top:7px;width:5px;height:5px;border-radius:50%;background:var(--accent-line)}

/* ── floor ── */

    topics: TOPICS.filter(() => r() < .85), ref_present: ri(r, 8, 14), ref_reason: 'Floor escalation during slot',
    oo: r() < .55 ? 'yes' : 'no', oo_list: [],
    crm: CRM.filter(() => r() < .88), crm_gaps: 'Updated stale dispositions on 3 leads',
    cases: { mis: { none: true, items: [] } }
  };
  k.members = ri(r, 8, 14); k.calls = ri(r, 22, 34) * k.members; const at = ri(r, 150, 320); k.avg_talk = Math.floor(at / 60) + ':' + String(at % 60).padStart(2, '0');
  k.talk_hrs = Math.round(k.calls * (0.35 + r() * 0.2) * at / 3600 * 2) / 2;
  k.in_dc = Math.round(demos * (0.6 + r() * 0.2)); k.ni_dc = demos - k.in_dc;
  k.in_cl = Math.round(k.in_dc * (0.15 + r() * 0.2)); k.ni_cl = Math.round(k.ni_dc * (0.1 + r() * 0.2)); k.enrols = k.in_cl + k.ni_cl;
  k.in_cnt = k.in_dc + ri(r, 10, 30); k.ni_cnt = k.ni_dc + ri(r, 5, 18);
  k.plan_m = Math.round(k.enrols * (0.55 + r() * 0.3)); k.plan_bm = k.enrols - k.plan_m;
  if (k.oo === 'yes') k.oo_list = Array.from({ length: r() < .7 ? 1 : 2 }, () => ({ counsellor: pick(r, adv), topic: pick(r, OO_TOPICS), email: r() < .6 ? 'yes' : 'no' }));
  PIPE.forEach(([p], j) => { const t = ri(r, [6, 3, 3, 0][j], [18, 12, 10, 6][j]); k[p] = t; k[p + '_c'] = Math.round(t * (0.2 + r() * 0.5)); });
  k.audit_list.forEach((a, j) => { if (a.verdict === 'Mis-sale identified') { k.cases.mis.none = false; k.cases.mis.items.push({ advisor: a.advisor, ref: a.lead, issue: pick(r, ['Promised guaranteed grade jump', 'Hid recurring fee', 'Claimed limited seats falsely']), checks: ['Evidence verified', 'L1 intervention', 'Documented', 'Advisor coached'], esc: pick(r, ['No', 'L2']), status: pick(r, ['Open', 'In progress', 'Closed']), fromAudit: j }); } });
  return k;
}

const DB = { days: {}, cutoff: {}, mails: [], drafts: {} };
function seed() {
  const r = rng(20261030), os = openShift();
  TLS.forEach((t, i) => {
    const d = DB.days[t.id] = {};
    const offDow = [0, 1, 6, 2, 0, 3, 5, 4, 1][i];
    const lopP = [.04, .06, .03, .1, .02, .05, .11, .04, .07][i];
    for (let k = CFG.START; k < os; k = addDays(k, 1)) {
      if (dow(k) === offDow) { d[k] = { off: 'weekoff', markedAt: fromKey(k).getTime() - DAY }; continue; }
      const x = r();
      if (x < .025) { d[k] = { off: 'leave', reason: pick(r, ['Medical', 'Family function', 'Personal work']), markedAt: fromKey(k).getTime() - 2 * DAY }; continue; }
      if (x < .025 + lopP) { d[k] = {}; continue; }   // nothing filled: LOP
      const sub = deadline(k) - (ri(r, 15, 460)) * 60000;
      d[k] = { kra: genKRA(r, i, t.id), submittedAt: sub };
    }
  });
  /* tonight's board: a realistic mid-morning mix */
  const plan = { prabhu: 'blank', naeem: 'sub', uday: 'draft', deepali: 'blank', satyam: 'blank', pranesh: 'sub', ishan: 'blank', umar: 'off', prathuin: 'sub' };
  TLS.forEach((t, i) => {
    const p = plan[t.id], d = DB.days[t.id];
    if (p === 'sub') d[os] = { kra: genKRA(r, i, t.id), submittedAt: Math.min(Date.now() - ri(r, 10, 200) * 60000, deadline(os) - 60000) };
    else if (p === 'off') d[os] = { off: 'weekoff', markedAt: Date.now() - 3 * DAY };
    else if (p === 'draft') { const g = genKRA(r, i, t.id); DB.drafts[t.id] = { k: os, v: Object.fromEntries(['members', 'calls', 'avg_talk', 'talk_hrs', 'rev_target', 'rev_close', 'rp_target', 'rp_close', 'in_cnt', 'in_dc', 'in_cl', 'ni_cnt', 'ni_dc', 'ni_cl', 'plan_m', 'plan_bm', 'demos', 'enrols', 'recovery', 'audits', 'audit_list', 'voc', 'voc_list'].map(x => [x, g[x]])), step: 2, visited: [0, 1] }; delete d[os]; }
    else delete d[os];
  });
  /* one backdated leave that reversed an LOP, to show the flow */
  let rk = addDays(os, -6);
  while (DB.days.ishan[rk] && DB.days.ishan[rk].off) rk = addDays(rk, -1);
  DB.days.ishan[rk] = { off: 'leave', reason: 'Fever; informed Vikash on call', markedAt: deadline(rk) + 2 * DAY, reversed: true, lopMailedAt: deadline(rk) + 60000 };
  /* mail log for recent LOPs */
  for (let k = addDays(os, -8); k < os; k = addDays(k, 1))
    TLS.forEach(t => {
      const e = DB.days[t.id][k];
      if (e && e.reversed) { DB.mails.push(mailLOP(t, k, e.lopMailedAt)); DB.mails.push(mailReversed(t, k, e.off, e.markedAt)); }
      else if (statusOf(t.id, k) === 'lop') DB.mails.push(mailLOP(t, k, deadline(k) + 60000));
    });
  DB.mails.sort((a, b) => b.at - a.at);
}

/* ── status rules (the same rules run server-side in the live build) ── */
function statusOf(id, k) {
  const e = (DB.days[id] || {})[k], os = openShift();
  if (e && e.off) return e.off;                       // weekoff | leave
  if (e && e.submittedAt) return 'present';
  if (k > os) return 'future';
  if (k < CFG.START) return 'none';
  if (k === os && !DB.cutoff[k]) return DB.drafts[id] && DB.drafts[id].k === k ? 'progress' : 'pending';
  return 'lop';
}
const LABEL = { present: 'Present', lop: 'LOP', weekoff: 'Week off', leave: 'Leave', pending: 'Not started', progress: 'In progress', future: '', none: '' };
const chip = s => `<span class="st st-${s}">${LABEL[s] || '—'}</span>`;
function canMarkOff(id, k) {
  const t = istToday(), s = statusOf(id, k);
  if (k < CFG.START) return { ok: false, why: 'Before the tracker started.' };
  if (k < addDays(t, -CFG.BACKDATE_DAYS)) return { ok: false, why: 'More than 15 days ago, so it can no longer be changed.' };
  if (k > addDays(t, CFG.AHEAD_DAYS)) return { ok: false, why: 'Too far ahead.' };
  if (s === 'present') return { ok: false, why: 'A KRA was submitted for this day.' };
  return { ok: true };
}
function weekOffClash(id, k) {
  const ws = weekStart(k);
  for (let i = 0; i < 7; i++) { const d = addDays(ws, i); if (d !== k && statusOf(id, d) === 'weekoff') return d; }
  return null;
}

/* ── month stats ── */
function stats(id, month) {
  const os = openShift(), o = { present: 0, lop: 0, weekoff: 0, leave: 0, reversed: 0, tgt: 0, close: 0, rpT: 0, rpC: 0, demos: 0, enrols: 0, audits: 0, voc: 0, oo: 0, openCases: 0, mis: 0, verdicts: {} };
  for (let k = month + '-01'; monthOf(k) === month && k <= os; k = addDays(k, 1)) {
    const s = statusOf(id, k), e = (DB.days[id] || {})[k];
    if (o[s] != null && s !== 'pending' && s !== 'progress') o[s]++;
    if (e && e.reversed) o.reversed++;
    if (s === 'present') {
      const q = e.kra;
      o.tgt += +q.rev_target || 0; o.close += +q.rev_close || 0; o.rpT += +q.rp_target || 0; o.rpC += +q.rp_close || 0;
      o.demos += +q.demos || 0; o.enrols += +q.enrols || 0; o.audits += +q.audits || 0; o.voc += +q.voc || 0;
      o.oo += (q.oo_list || []).length;
      (q.audit_list || []).forEach(a => { if (a.verdict) o.verdicts[a.verdict] = (o.verdicts[a.verdict] || 0) + 1; });
      (q.cases.mis.items || []).forEach(c => { o.mis++; if (c.status !== 'Closed') o.openCases++; });
    }
  }
  o.work = o.present + o.lop; o.comp = o.work ? o.present / o.work : null;
  o.att = o.tgt ? o.close / o.tgt : null; o.rpAtt = o.rpT ? o.rpC / o.rpT : null; o.dc2e = o.demos ? o.enrols / o.demos : null;
  o.apd = o.present ? o.audits / o.present : null; o.vpd = o.present ? o.voc / o.present : null;
  return o;
}
/* pipeline as of a TL's latest KRA: totals come from the four lines they fill in */
function pipeOf(q) {
  const cats = PIPE.map(([p, l]) => ({ p, l, t: +q[p] || 0, c: +q[p + '_c'] || 0 }));
  const total = cats.reduce((a, x) => a + x.t, 0), closed = cats.reduce((a, x) => a + x.c, 0);
  return { cats, total, closed, open: total - closed };
}
function latestKRA(id) {
  for (let k = openShift(), i = 0; i < 10; i++, k = addDays(k, -1)) { const e = DB.days[id][k]; if (e && e.submittedAt) return { k, e }; }
  return null;
}

function streak(id) {
  let n = 0, k = openShift();
  if (statusOf(id, k) !== 'present') k = addDays(k, -1);
  for (let i = 0; i < 120 && k >= CFG.START; i++, k = addDays(k, -1)) {
    const s = statusOf(id, k);
    if (s === 'present') n++; else if (s === 'weekoff' || s === 'leave') continue; else break;
  }
  return n;
}

/* ── mails (the live script sends these from the sender account via MailApp) ── */
function mailLOP(t, k, at) {
  const m = MGRS[t.mgr];
  return { type: 'lop', at, to: t.email, cc: m.email, subject: `LOP marked for ${fmtDay(k)}: daily KRA not submitted`,
    body: `Hi ${first(t.name)},\n\nYour daily KRA for the shift of ${fmtLong(k)} was not submitted by the 11:30 AM IST cut-off, so the day has been marked as LOP.\n\nMissed entries cannot be filled in afterwards.\n\nIf this day was your week off or an approved leave, mark it in your Daily KRA calendar by ${fmtLong(addDays(k, CFG.BACKDATE_DAYS))}. The LOP will then be reversed and ${first(m.name)} will be informed.\n\nDaily KRA: ${CFG.URL}\n\nThis is an automated message from the Business Command Centre.` };
}
function mailReversed(t, k, off, at) {
  const m = MGRS[t.mgr];
  return { type: 'rev', at, to: t.email, cc: m.email, subject: `LOP reversed for ${fmtDay(k)}: marked as ${LABEL[off].toLowerCase()}`,
    body: `Hi ${first(t.name)},\n\nYou marked ${fmtLong(k)} as ${LABEL[off].toLowerCase()} on ${fmtStamp(at)}, so the LOP for that day has been reversed.\n\n${first(m.name)}, this was marked after the day had passed. It is shown under "Marked after the day" in your team view.\n\nDaily KRA: ${CFG.URL}\n\nThis is an automated message from the Business Command Centre.` };
}
function mailReminder(t, k) {
  return { type: 'rem', at: deadline(k) - 3600000, to: t.email, cc: '', subject: `1 hour left: daily KRA for ${fmtDay(k)}`,
    body: `Hi ${first(t.name)},\n\nYour daily KRA for the shift of ${fmtLong(k)} is not submitted yet. The cut-off is 11:30 AM IST, after which the day is marked as LOP and ${first(MGRS[t.mgr].name)} is informed.\n\nIt takes about 5 minutes: ${CFG.URL}\n\nThis is an automated message from the Business Command Centre.` };
}
</script>
<script>
/* ════════════════ state ════════════════ */
const S = { seen: new Set(), as: 'tl:prabhu', view: 'day', step: 0, editing: false, errs: new Set(), calMonth: null, sel: new Set(), mgr: 'akash', mailSel: 0, showErr: false };
const role = () => S.as.split(':')[0];
const meId = () => S.as.split(':')[1];
const me = () => TL(meId());

/* ════════════════ path helpers for the draft ════════════════ */
const getP = (o, p) => p.split('.').reduce((a, k) => a == null ? a : a[k], o);
function setP(o, p, v) { const ks = p.split('.'); let a = o; ks.slice(0, -1).forEach(k => { if (a[k] == null) a[k] = {}; a = a[k]; }); a[ks[ks.length - 1]] = v; }

function blankKRA(id) {
  let tgt = '', rpt = '';
  for (let k = addDays(openShift(), -1), i = 0; i < 30; i++, k = addDays(k, -1)) { const e = DB.days[id][k]; if (e && e.kra) { tgt = e.kra.rev_target; rpt = e.kra.rp_target; break; } }
  return { members: 0, calls: '', avg_talk: '', talk_hrs: '', rev_target: tgt, rev_close: '', rp_target: rpt, rp_close: '',
    in_cnt: '', in_dc: '', in_cl: '', ni_cnt: '', ni_dc: '', ni_cl: '', plan_m: '', plan_bm: '', demos: 0, enrols: 0, recovery: '',
    audits: 0, audit_list: [], voc: 0, voc_list: [], ref_held: '', ref_start: '23:00', ref_end: '00:00', topics: [], ref_present: 0, ref_reason: '',
    oo: '', oo_list: [], crm: [], crm_gaps: '', pl_hi: 0, pl_hi_c: 0, pl_pay: 0, pl_pay_c: 0, pl_dm: 0, pl_dm_c: 0, pl_od: 0, pl_od_c: 0,
    cases: { mis: { none: false, items: [] } } };
}
function draft() {
  const id = meId(), os = openShift();
  let d = DB.drafts[id];
  if (!d || d.k !== os) d = DB.drafts[id] = { k: os, v: blankKRA(id), step: 0, visited: [] };
  if (!d.visited) d.visited = [];
  const b = blankKRA(id); for (const k in b) if (d.v[k] === undefined) d.v[k] = b[k];
  return d;
}
let F = {};

/* ════════════════ field builders ════════════════ */
const ek = k => S.showErr && S.errs.has(k) ? ' err' : '';
const v = k => getP(F, k);
const fMoney = (k, l) => `<div class="f${ek(k)}" data-f="${k}"><label for="i-${k}">${l}</label><div class="money"><input class="inp" id="i-${k}" inputmode="numeric" autocomplete="off" data-k="${k}" data-t="num" value="${esc(v(k) ?? '')}" placeholder="0"></div></div>`;
function fStep(k, l, target) {
  const n = +v(k) || 0;
  const pips = target ? `<div class="pips" aria-hidden="true">${Array.from({ length: Math.max(target, Math.min(n, 6)) }, (_, i) => `<i class="${i < n ? 'on' : ''}"></i>`).join('')}</div>` : '';
  return `<div class="f${ek(k)}" data-f="${k}"><span class="lab" id="l-${k}">${l}</span><div class="stp"><button type="button" data-act="dec" data-k="${k}" aria-label="Decrease">−</button><input inputmode="numeric" aria-labelledby="l-${k}" data-k="${k}" data-t="num" value="${n}"><button type="button" data-act="inc" data-k="${k}" aria-label="Increase">+</button></div>${pips}</div>`;
}
const fYN = (k, l, opts = [['yes', 'Yes'], ['no', 'No']]) => `<div class="f${ek(k)}" data-f="${k}"><span class="lab">${l}</span><div class="yn" role="group">${opts.map(([val, t]) => `<button type="button" data-act="yn" data-k="${k}" data-v="${val}" class="${v(k) === val ? 'on' : ''}" aria-pressed="${v(k) === val}">${t}</button>`).join('')}</div></div>`;
const fChips = (k, l, list, hint) => `<div class="f${ek(k)}" data-f="${k}"><span class="lab">${l}${hint ? ` <span style="color:var(--dim)">${hint}</span>` : ''}</span><div class="chips">${list.map(o => { const on = (v(k) || []).includes(o); return `<button type="button" class="chip${on ? ' on' : ''}" data-act="chip" data-k="${k}" data-v="${esc(o)}" aria-pressed="${on}">${esc(o)}</button>`; }).join('')}</div></div>`;
const fText = (k, l, ph = '', area, list) => `<div class="f${ek(k)}" data-f="${k}"><label for="i-${k}">${l}</label>${area ? `<textarea class="inp" id="i-${k}" data-k="${k}" placeholder="${esc(ph)}">${esc(v(k) || '')}</textarea>` : `<input class="inp" id="i-${k}" data-k="${k}" autocomplete="off"${list ? ` list="${list}"` : ''} placeholder="${esc(ph)}" value="${esc(v(k) || '')}">`}</div>`;
const fTime = (k, l) => `<div class="f${ek(k)}" data-f="${k}"><label for="i-${k}">${l}</label><input type="time" class="inp" id="i-${k}" data-k="${k}" value="${esc(v(k) || '')}"></div>`;
const fSel = (k, l, opts) => `<div class="f${ek(k)}" data-f="${k}"><label for="i-${k}">${l}</label><select class="inp" id="i-${k}" data-k="${k}"><option value="">Choose</option>${opts.map(o => `<option${v(k) === o ? ' selected' : ''}>${esc(o)}</option>`).join('')}</select></div>`;
const meter = (id, label) => `<div class="meter"><div class="top"><span>${label}</span><b id="${id}-v">—</b></div><div class="bar"><i id="${id}-b"></i><span class="mark" id="${id}-m" hidden></span></div><div class="msg" id="${id}-msg"></div></div>`;

/* ════════════════ the six sections ════════════════ */
const fDec = (k, l, ph = '0') => `<div class="f${ek(k)}" data-f="${k}"><label for="i-${k}">${l}</label><input class="inp mono" id="i-${k}" inputmode="decimal" autocomplete="off" data-k="${k}" data-t="dec" value="${esc(v(k) ?? '')}" placeholder="${ph}"></div>`;
const fVerd = k => `<div class="f${ek(k)}" data-f="${k}"><span class="lab">Verdict</span><div class="verd" role="group">${VERDICTS.map(o => `<button type="button" data-act="yn" data-k="${k}" data-v="${esc(o)}" class="${v(k) === o ? 'on' : ''}" style="--vc:${VCOL[o]}" aria-pressed="${v(k) === o}">${o}</button>`).join('')}</div></div>`;
const fNum = (k, l, ph = '0') => `<div class="f${ek(k)}" data-f="${k}"><label for="i-${k}">${l}</label><input class="inp mono" id="i-${k}" inputmode="numeric" autocomplete="off" data-k="${k}" data-t="num" value="${esc(v(k) ?? '')}" placeholder="${ph}"></div>`;
const fCell = (k, aria) => `<div class="f${ek(k)}" data-f="${k}"><input class="inp mono" aria-label="${esc(aria)}" inputmode="numeric" autocomplete="off" data-k="${k}" data-t="num" value="${esc(v(k) ?? '')}" placeholder="0"></div>`;
const vchip = vd => vd ? `<span class="vchip" style="--vc:${VCOL[vd]}">${esc(vd)}</span>` : '';
const blankAudit = () => ({ lead: '', stage: '', advisor: '', verdict: '', note: '' });
const blankVOC = () => ({ lead: '', grade: '', eth: '', stage: '', feedback: '' });
const blankOO = () => ({ counsellor: '', topic: '', email: '' });
const MAXN = { audits: 10, voc: 10 };
const nw = id => S.seen.has(id) ? '' : (S.seen.add(id), ' new');

/* keeps the per-audit / per-VOC cards in step with the counts, and turns
   every "Mis-sale identified" audit into a pre-filled mis-selling case */
function normalize() {
  F.demos = (+F.in_dc || 0) + (+F.ni_dc || 0); F.enrols = (+F.in_cl || 0) + (+F.ni_cl || 0);
  const fit = (lk, n, blank) => { if (!Array.isArray(F[lk])) F[lk] = []; while (F[lk].length < n) F[lk].push(blank()); F[lk].length = n; };
  fit('audit_list', Math.min(+F.audits || 0, MAXN.audits), blankAudit);
  fit('voc_list', Math.min(+F.voc || 0, MAXN.voc), blankVOC);
  if (F.oo === 'yes' && !(F.oo_list || []).length) F.oo_list = [blankOO()];
  if (F.oo !== 'yes') F.oo_list = [];
  const mis = F.cases.mis;
  mis.items = mis.items.filter(c => c.fromAudit == null || (F.audit_list[c.fromAudit] && F.audit_list[c.fromAudit].verdict === 'Mis-sale identified'));
  F.audit_list.forEach((a, i) => {
    if (a.verdict !== 'Mis-sale identified') return;
    let c = mis.items.find(x => x.fromAudit === i);
    if (!c) { c = { ...CASES.mis.blank(), fromAudit: i }; mis.items.unshift(c); mis.none = false; }
    if (!c.ref) c.ref = a.lead; if (!c.advisor) c.advisor = a.advisor;
  });
}

const CASES = {
  mis: { title: 'Mis-selling cases', kra: 'Zero tolerance. Log every L1 intervention.', none: 'No mis-selling seen', add: 'Log a case',
    blank: () => ({ advisor: '', ref: '', issue: '', checks: [], esc: '', status: '' }),
    fields: p => `<div class="grid">${fText(p + 'advisor', 'Advisor', 'Start typing', 0, 'advl')}${fText(p + 'ref', 'Lead ID or call ref', 'e.g. LD-10234')}${fSel(p + 'esc', 'Escalated?', ['No', 'L2', 'L3', 'Compliance'])}${fSel(p + 'status', 'Status', ['Open', 'In progress', 'Closed'])}</div><div class="grid w2" style="margin-top:12px">${fText(p + 'issue', 'What was misleading?', 'e.g. promised a guaranteed grade jump')}</div><div style="margin-top:12px">${fChips(p + 'checks', 'Steps done', ['Evidence verified', 'L1 intervention', 'Documented', 'Advisor coached'])}</div>`,
    need: (c, p) => [['advisor', 'Name the advisor'], ['issue', 'Describe the issue'], ['esc', 'Choose escalation'], ['status', 'Choose a status']].filter(([f]) => !c[f]).map(([f, m]) => [p + f, m]) }
};
function casesBlock(g) {
  const C = CASES[g], st = F.cases[g], err = S.showErr && S.errs.has('cases.' + g);
  const flagged = F.audit_list.filter(a => a.verdict === 'Mis-sale identified').length;
  return `<div class="blk"><h4>${C.title} <small>${C.kra}</small></h4>
    ${flagged ? `<div class="warnline" style="margin:0 0 12px">${flagged} audit${flagged > 1 ? 's' : ''} marked “Mis-sale identified”, so ${flagged > 1 ? 'cases are' : 'a case is'} started below with the lead and advisor filled in.</div>` : ''}
    <div class="chips">${flagged ? '' : `<button type="button" class="chip${st.none ? ' on' : ''}" data-act="case-none" data-g="${g}" aria-pressed="${st.none}">${C.none}</button>`}
    <button type="button" class="btn btn-s" data-act="case-add" data-g="${g}">+ ${C.add}</button></div>
    ${err ? `<div class="errs" style="margin-top:8px">Mark “${C.none.toLowerCase()}” or log at least one.</div>` : ''}
    ${st.items.map((c, i) => `<div class="case${nw('m' + i)}"><div class="case-h"><span>Case ${i + 1}${c.fromAudit != null ? ' <small class="note">from audit ' + (c.fromAudit + 1) + '</small>' : ''}</span>${c.fromAudit != null ? '' : `<button type="button" class="link" data-act="case-del" data-g="${g}" data-i="${i}">Remove</button>`}</div>${C.fields(`cases.${g}.items.${i}.`)}</div>`).join('')}</div>`;
}
const advList = () => `<datalist id="advl">${(ADVISORS[meId()] || []).map(a => `<option value="${esc(a)}">`).join('')}</datalist>`;

function arc(r, a0, a1) {
  const p = a => [100 + r * Math.cos(a * Math.PI / 180), 100 + r * Math.sin(a * Math.PI / 180)];
  const [x0, y0] = p(a0), [x1, y1] = p(a1);
  return `M${x0.toFixed(2)} ${y0.toFixed(2)}A${r} ${r} 0 ${a1 - a0 > 180 ? 1 : 0} 1 ${x1.toFixed(2)} ${y1.toFixed(2)}`;
}
function clockSVG(state) {
  const C = 2 * Math.PI * 92;
  const segs = STEPS.map((_, i) => `<path class="seg ${state.done[i] ? 'done' : ''}${state.cur === i ? ' cur' : ''}" d="${arc(74, i * 60 + 3, i * 60 + 57)}"/>`).join('');
  return `<svg viewBox="0 0 200 200" aria-hidden="true"><circle class="trk" cx="100" cy="100" r="92"/><circle class="time" id="tarc" cx="100" cy="100" r="92" stroke-dasharray="${C}" stroke-dashoffset="${C}"/>${segs}</svg>
    <div class="clock-c">${state.center}</div>`;
}
function heroFacts(id) {

  const days = Array.from({ length: 7 }, (_, i) => addDays(os, i - 6));

    <div class="fact"><b>${st.present}/${st.work}</b><span>working days present this month</span></div>
    <div class="fact"><b class="${st.lop ? 'bad' : ''}">${st.lop}</b><span>LOP this month</span></div></div>
    <div class="week" aria-label="Last 7 days">${days.map(k => { const s = statusOf(id, k); return `<div class="wd ${s}" title="${fmtDay(k)}: ${LABEL[s] || '—'}">${fmtDay(k).slice(0, 3)}<i></i></div>`; }).join('')}</div>`;
}
function viewDay(opt) {

  const closed = DB.cutoff[os];
  let center, done = STEPS.map(() => false), cur = -1, headline, sub, cdHTML = '';
  if (s === 'present' && !S.editing) { center = `<b>Done</b><span>${fmtTime(e.submittedAt)}</span>`; done = done.map(() => true); headline = 'You’re marked present'; sub = `Shift of ${fmtLong(os)}. You can still edit until 11:30 AM.`; }
  else if (s === 'weekoff' || s === 'leave') { center = `<b>Off</b><span>${LABEL[s]}</span>`; headline = `${LABEL[s]} today`; sub = `Shift of ${fmtLong(os)}. No KRA needed. Changed plans? Clear it in your calendar.`; }
  else if (s === 'lop') { center = `<b>LOP</b><span>missed</span>`; headline = 'This shift is closed'; sub = `The KRA for ${fmtLong(os)} wasn’t submitted by 11:30 AM.`; }
  else {
    const d = draft(); F = d.v; normalize();
    done = STEPS.map((_, i) => d.visited.includes(i) && stepOK(i)); cur = S.step;
    center = `<b>${done.filter(Boolean).length}/6</b><span>sections done</span>`;
    headline = `Shift of ${fmtDay(os)}`; sub = S.editing ? 'Editing your submitted KRA. Save again before 11:30 AM.' : 'Fill all six sections and submit to mark yourself present. Your progress saves as you go.';
  }
  if (!closed && s !== 'lop') cdHTML = `<div class="cd" id="cd"><b id="cdv">--:--:--</b><span>left until the 11:30 AM IST cut-off on ${fmtDay(addDays(os, 1))}</span></div>`;
  const hero = `<section class="panel hero"><div class="clock${s === 'present' && !S.editing ? ' allgood' : ''}" id="clock">${clockSVG({ done, cur, center })}</div>
    <div><h2>${headline}</h2><p class="sub">${sub}</p>${cdHTML}${heroFacts(id)}</div></section>`;

  let body;

  else if (s === 'lop') body = `<section class="panel done"><div class="stamp lop"><b>LOP</b><span>${fmtDay(os)}</span></div><div><h3>Missed entries can’t be filled in later</h3><p>An email went to you and ${esc(MGRS[me().mgr].name)}. If this was your week off or an approved leave, mark it in your calendar by ${fmtDay(addDays(os, CFG.BACKDATE_DAYS))} and the LOP is reversed. The next shift opens at 11:30 AM.</p><div class="acts"><button class="btn btn-p" data-act="view" data-v="cal">Mark week off or leave</button></div></div></section>`;

function markOff(type) {
  const id = meId(), t = me(), arr = [...S.sel].sort(), reason = ($('lvr') || {}).value || '';
  if (type === 'leave' && !reason.trim()) { toast('Add a reason for the leave.'); $('lvr').focus(); return; }
  if (type === 'weekoff') {
    const weeks = {};
    for (const k of arr) { const w = weekStart(k); if (weeks[w]) return toast(`${fmtDay(weeks[w])} and ${fmtDay(k)} fall in the same week. One week off per week.`); weeks[w] = k;
      const c = weekOffClash(id, k); if (c && !S.sel.has(c)) return toast(`You already have a week off on ${fmtDay(c)} that week.`); }
  }
  if (IS_LIVE) {
    api('markOff', { dates: arr, type, reason: reason.trim() }).then(r => {
      if (!r.ok) return toast(r.message || 'Couldn’t save. Try again.');
      Object.assign(DB.days[id], r.days); S.sel.clear(); render();
      toast(`${arr.length} day${arr.length > 1 ? 's' : ''} marked as ${LABEL[type].toLowerCase()}${r.reversed ? `. ${r.reversed} LOP reversed and ${first(MGRS[t.mgr].name)} emailed` : ''}.`); });
    return;
  }
  let reversed = 0;
  for (const k of arr) {
    if (!canMarkOff(id, k).ok) continue;
    const was = statusOf(id, k), now = Date.now();
    DB.days[id][k] = { off: type, reason: type === 'leave' ? reason.trim() : '', markedAt: now, backdated: k < openShift(), reversed: was === 'lop' };
    if (was === 'lop') { reversed++; DB.mails.unshift(mailReversed(t, k, type, now)); }
  }
  S.sel.clear(); render();
  toast(`${arr.length} day${arr.length > 1 ? 's' : ''} marked as ${LABEL[type].toLowerCase()}${reversed ? `. ${reversed} LOP reversed and ${first(MGRS[t.mgr].name)} emailed` : ''}.`);
}

const tsec = s => { const m = /^(\d{1,3}):([0-5]\d)$/.exec(s || ''); return m ? +m[1] * 60 + +m[2] : null; };
const fmtDur = s => s == null || !isFinite(s) ? '—' : Math.floor(s / 60) + ':' + String(Math.round(s % 60)).padStart(2, '0');
function callsOf(q) { return { members: +q.members || 0, calls: +q.calls || 0, avg: tsec(q.avg_talk), hrs: +q.talk_hrs || 0 }; }
function callsAgg(recs) {
  const a = { n: 0, members: 0, calls: 0, hrs: 0, wsec: 0, wcalls: 0 };
  recs.forEach(q => { const c = callsOf(q); a.n++; a.members += c.members; a.calls += c.calls; a.hrs += c.hrs; if (c.avg != null) { a.wsec += c.avg * c.calls; a.wcalls += c.calls; } });
  a.avg = a.wcalls ? a.wsec / a.wcalls : null; return a;
}
function viewCalls() {

  const T = callsAgg(tonight.map(x => x.e.kra));
  const monthRecs = t => { const r = []; for (let k = m + '-01'; monthOf(k) === m && k <= os; k = addDays(k, 1)) { const e = DB.days[t.id][k]; if (e && e.submittedAt) r.push(e.kra); } return r; };
  const due = list.filter(t => !['weekoff', 'leave'].includes(statusOf(t.id, os))).length;
  /* last 14 shifts, whole scope */
  const days = Array.from({ length: 14 }, (_, i) => addDays(os, i - 13));
  const series = days.map(k => callsAgg(list.map(t => DB.days[t.id][k]).filter(e => e && e.submittedAt).map(e => e.kra)));
  const maxC = Math.max(1, ...series.map(s => s.calls));
  const rows = list.map(t => { const e = DB.days[t.id][os], q = e && e.submittedAt ? callsOf(e.kra) : null, M = callsAgg(monthRecs(t));
    return `<tr class="click" data-act="tl" data-id="${t.id}" tabindex="0"><td><span class="tl-n"><span class="av">${initials(t.name)}</span>${esc(t.name)}</span></td><td>${chip(statusOf(t.id, os))}</td>
      <td class="n">${q ? q.members : '—'}</td><td class="n">${q ? fmtN(q.calls) : '—'}</td><td class="n">${q ? fmtDur(q.avg) : '—'}</td><td class="n">${q ? q.hrs.toFixed(1) : '—'}</td><td class="n">${q && q.members ? (q.calls / q.members).toFixed(1) : '—'}</td>
      <td class="n">${M.n ? fmtN(M.calls / M.n) : '—'}</td><td class="n">${fmtDur(M.avg)}</td><td class="n">${M.n ? (M.hrs / M.n).toFixed(1) : '—'}</td><td class="n">${M.n ? (M.members / M.n).toFixed(1) : '—'}</td></tr>`; }).join('');
  $('view').innerHTML = `${role() === 'admin' ? `<div style="margin-bottom:14px"><label class="note">Showing <select class="inp" style="width:auto;display:inline-block;margin-left:6px" data-act-change="callmgr"><option value="all">The whole floor</option>${Object.entries(MGRS).map(([k, mg]) => `<option value="${esc(k)}"${k === scopeMgr ? ' selected' : ''}>${esc(mg.name)}’s team</option>`).join('')}</select></label></div>` : ''}
    <div class="kpis"><div class="kpi"><span>Team members present</span><b data-count="${T.members}">${T.members}</b><small>tonight, from ${T.n} of ${due} KRAs in</small></div>
      <div class="kpi"><span>Calls made</span><b data-count="${T.calls}">${fmtN(T.calls)}</b><small>${T.members ? (T.calls / T.members).toFixed(1) + ' per member' : 'per member —'}</small></div>

      <div class="kpi"><span>Total talk time</span><b>${T.hrs.toFixed(1)} h</b><small>${T.members ? (T.hrs / T.members).toFixed(1) + ' h per member' : '—'}</small></div></div>
    <section class="panel"><div class="ph"><h2>Calls by team lead</h2><p>Shift of ${fmtDay(os)}, and daily averages for ${fromKey(m + '-01').toLocaleDateString('en-GB', { month: 'long', timeZone: 'UTC' })}</p></div><div class="pb tw"><table>
      <tr><th>Team lead</th><th>Tonight</th><th class="n">Members</th><th class="n">Calls</th><th class="n">Avg talk</th><th class="n">Talk hrs</th><th class="n">Calls/member</th><th class="n">Calls/day (month)</th><th class="n">Avg talk (month)</th><th class="n">Talk hrs/day</th><th class="n">Members/day</th></tr>${rows}</table></div></section>

      <div class="trend">${series.map((s, i) => `<div class="tcol" title="${fmtDay(days[i])}: ${fmtN(s.calls)} calls, ${s.hrs.toFixed(1)} talk hrs, avg ${fmtDur(s.avg)}"><span class="tv">${s.calls ? fmtN(s.calls) : ''}</span><i style="--h:${s.calls / maxC * 100}%"></i><span class="th">${s.hrs ? s.hrs.toFixed(0) + 'h' : ''}</span><span class="td">${fmtDay(days[i]).slice(0, 3)} ${+days[i].slice(8)}</span></div>`).join('')}</div></div></section>`;

function confetti() {

  hit.forEach(t => DB.mails.unshift(mailReminder(t, os)));
  S.mailSel = 0; render();
  toast(hit.length ? `Reminder sent to ${hit.length} team lead${hit.length > 1 ? 's' : ''} who haven’t submitted.` : 'Everyone has submitted. No reminders needed.');
  if (hit.length) setTimeout(mailLog, 500);
}

document.addEventListener('click', ev => {
  const el = ev.target.closest('[data-act]'); if (!el) return;
  if (S.view === 'day') saveDraftSoon();
  const a = el.dataset.act, k = el.dataset.k;
  if (a === 'close-bg' && ev.target !== el) return;
  switch (a) {
    case 'view': S.view = el.dataset.v; S.sel.clear(); closeModal(); render(); window.scrollTo(0, 0); break;
    case 'inc': case 'dec': setP(F, k, Math.min(MAXN[k] || 999, Math.max(0, (+v(k) || 0) + (a === 'inc' ? 1 : -1)))); stageHTML(false); refreshClock(); railHTML(); break;
    case 'yn': setP(F, k, el.dataset.v); stageHTML(false); refreshClock(); railHTML(); break;
    case 'chip': { const arr = [...(v(k) || [])], o = el.dataset.v, i = arr.indexOf(o); i >= 0 ? arr.splice(i, 1) : arr.push(o); setP(F, k, arr); stageHTML(false); refreshClock(); railHTML(); break; }
    case 'case-none': { const st = F.cases[el.dataset.g]; st.none = !st.none; if (st.none) st.items = []; stageHTML(false); refreshClock(); railHTML(); break; }
    case 'case-add': { const g = el.dataset.g, st = F.cases[g]; st.none = false; st.items.push(CASES[g].blank()); stageHTML(false); refreshClock(); railHTML(); break; }
    case 'case-del': F.cases[el.dataset.g].items.splice(+el.dataset.i, 1); stageHTML(false); refreshClock(); railHTML(); break;
    case 'oo-add': F.oo_list.push(blankOO()); stageHTML(false); refreshClock(); railHTML(); break;
    case 'oo-del': F.oo_list.splice(+el.dataset.i, 1); stageHTML(false); refreshClock(); railHTML(); break;
    case 'fresh': { const id = meId(), os = openShift(); delete DB.days[id][os]; delete DB.drafts[id]; S.seen.clear(); S.step = 0; S.editing = false; render(); toast('Fresh entry started for ' + first(me().name) + '.'); break; }
    case 'signout': signOut(); break;
    case 'step': goStep(+el.dataset.i, +el.dataset.i < S.step ? 'back' : ''); break;
    case 'next': { if (!stepOK(S.step)) { S.showErr = true; stageHTML(false); const d = draft(); if (!d.visited.includes(S.step)) d.visited.push(S.step); railHTML(); const f = document.querySelector('.f.err .inp,.f.err input,.f.err button'); f && f.focus(); return; } goStep(S.step + 1); break; }
    case 'back': goStep(S.step - 1, 'back'); break;
    case 'submit': submit(); break;
    case 'edit': { const id = meId(), os = openShift(); DB.drafts[id] = { k: os, v: JSON.parse(JSON.stringify(DB.days[id][os].kra)), step: 0, visited: [0, 1, 2, 3, 4, 5] }; S.editing = true; S.step = 0; render(); break; }
    case 'cal-mv': { const d = fromKey(S.calMonth + '-01'); d.setUTCMonth(d.getUTCMonth() + +el.dataset.n); S.calMonth = key(d).slice(0, 7); S.sel.clear(); render(); break; }
    case 'day': { if (el.getAttribute('aria-disabled')) { toast(el.title.split(' · ')[1] || 'This day can’t be changed.'); break; } S.sel.has(k) ? S.sel.delete(k) : S.sel.add(k); render(); break; }
    case 'mark': markOff(el.dataset.type); break;
    case 'clear-off': if (IS_LIVE) { const id = meId(), ds = [...S.sel]; api('clearOff', { dates: ds }).then(r => { if (!r.ok) return toast(r.message); ds.forEach(k => delete DB.days[id][k]); S.sel.clear(); render(); toast('Marking removed.'); }); break; } { const id = meId(); [...S.sel].forEach(k => { delete DB.days[id][k]; }); S.sel.clear(); render(); toast('Marking removed.'); break; }
    case 'clear-sel': S.sel.clear(); render(); break;
    case 'tl': tlDrawer(el.dataset.id); break;
    case 'mails': S.mailSel = 0; mailLog(); break;
    case 'mail': S.mailSel = +el.dataset.i; mailLog(); break;
    case 'cutoff': runCutoff(); break;
    case 'remind': runReminder(); break;
    case 'reset': Object.assign(DB, { days: {}, cutoff: {}, mails: [], drafts: {} }); seed(); S.editing = false; S.step = 0; render(); toast('Sample data reset.'); break;
    case 'close': case 'close-bg': closeModal(); break;
  }
});
document.addEventListener('input', ev => {
  const el = ev.target; if (!el.dataset || !el.dataset.k || S.view !== 'day') return;
  const k = el.dataset.k;
  let val = el.value;
  if (el.dataset.t === 'num') { val = val.replace(/[^\d]/g, ''); if (MAXN[k] && +val > MAXN[k]) val = String(MAXN[k]); if (el.value !== val) el.value = val; val = val === '' ? '' : +val; }
  if (el.dataset.t === 'dec') { val = val.replace(/[^\d.]/g, '').replace(/(\..*)\./g, '$1'); if (el.value !== val) el.value = val; val = val === '' || val === '.' ? '' : val.endsWith('.') ? val : +val; }
  setP(F, k, val); normalize(); saveDraftSoon();
  const wrap = el.closest('.f'); if (wrap) wrap.classList.remove('err');
  live();
  /* conditional fields depend on these, so redraw the step (keeping focus) */
  if (['rev_close', 'rev_target', 'rp_close', 'rp_target', 'ref_start', 'audits', 'voc', 'in_dc', 'in_cl', 'ni_dc', 'ni_cl', 'plan_m', 'plan_bm', 'in_cnt', 'ni_cnt'].includes(k) && S.showErr || ['rev_close', 'rev_target', 'rp_close', 'rp_target', 'ref_start', 'audits', 'voc'].includes(k) || el.tagName === 'SELECT') {
    const pos = el.selectionStart; stageHTML(false); const n = document.querySelector(`[data-k="${k}"]`); if (n && n.tagName !== 'SELECT') { n.focus(); try { n.setSelectionRange(pos, pos); } catch (e) { } }
  }
  if (el.closest('.stp')) { const pips = el.closest('.f').querySelectorAll('.pips i'); pips.forEach((p, i) => p.classList.toggle('on', i < (+val || 0))); }
  refreshClock(); railHTML();
});
document.addEventListener('change', ev => {
  if (ev.target.dataset.actChange === 'mgr') { S.mgr = ev.target.value; render(); }
  if (ev.target.dataset.actChange === 'callmgr') { S.callMgr = ev.target.value; render(); }
  if (ev.target.id === 'asUser') { S.seen.clear(); S.as = ev.target.value; S.view = viewsFor()[0][0]; S.step = role() === 'tl' && DB.drafts[meId()] ? DB.drafts[meId()].step || 0 : 0; S.editing = false; S.sel.clear(); S.showErr = false; closeModal(); render(); window.scrollTo(0, 0); }
});
document.addEventListener('keydown', ev => {
  if (ev.key === 'Escape' && $('overlay').innerHTML) closeModal();
  if (ev.key === 'Enter' && ev.target.matches('tr[data-act="tl"]')) tlDrawer(ev.target.dataset.id);
});

/* ════════════════ boot ════════════════ */
$('asUser').innerHTML = `<optgroup label="Team leads">${TLS.map(t => `<option value="tl:${t.id}">${esc(t.name)}</option>`).join('')}</optgroup>
  <optgroup label="Managers">${Object.entries(MGRS).map(([k, m]) => `<option value="mgr:${k}">${esc(m.name)}</option>`).join('')}</optgroup>
  <optgroup label="Admin"><option value="admin:bc">${esc(ADMIN.name)}</option></optgroup>`;
if (IS_LIVE) { document.querySelector('.proto').style.display = 'none'; liveBoot(); } else { seed(); render(); }
</script>
</body></html>
